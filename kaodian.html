<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两学考点速记 · 广东岗前培训</title>
<style>
  :root{
    --ink:#1c3151;          /* 藏青 */
    --ink-2:#33517c;
    --paper:#f6f1e4;        /* 米纸 */
    --card:#fffdf6;
    --red:#b23a2f;          /* 朱砂 */
    --red-bg:#faecea;
    --green:#2f7d5b;        /* 竹青 */
    --green-bg:#eef6f0;
    --gold:#b98a2f;
    --muted:#8a7f66;
    --line:#d9cfb4;
    --serif:"Songti SC","STZhongsong","华文中宋","SimSun","宋体",serif;
    --kai:"KaiTi","STKaiti","楷体","BKaiKai",serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(rgba(28,49,81,.05) 1px, transparent 1.4px),
      linear-gradient(180deg,#f8f4e9 0%, var(--paper) 40%, #f3ecdb 100%);
    background-size:22px 22px, auto;
    min-height:100vh;
    line-height:1.75;
    padding:0 0 60px;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 16px}

  /* ===== 卷头 ===== */
  header{padding:34px 0 10px;text-align:center;position:relative}
  .paper-head{
    border:1px solid var(--ink);
    outline:1px solid var(--ink);
    outline-offset:5px;
    background:var(--card);
    padding:26px 20px 22px;
    position:relative;
    box-shadow:0 10px 28px rgba(28,49,81,.10);
  }
  .paper-head .sup{font-family:var(--serif);letter-spacing:.5em;color:var(--ink-2);font-size:13px;text-indent:.5em;margin-bottom:8px}
  .paper-head h1{font-family:var(--serif);font-size:clamp(24px,4.6vw,38px);letter-spacing:.14em;color:var(--ink);font-weight:700}
  .paper-head h1 .mdot{color:var(--red);margin:0 .08em}
  .paper-head .sub{margin-top:10px;font-size:13px;color:var(--muted);font-family:var(--kai)}
  .paper-head .sub b{color:var(--ink-2)}
  .seal{
    position:absolute;right:14px;bottom:-16px;
    width:62px;height:62px;border:3px solid var(--red);border-radius:6px;
    color:var(--red);font-family:var(--kai);font-weight:700;
    display:grid;grid-template-columns:1fr 1fr;place-items:center;
    font-size:22px;line-height:1;transform:rotate(7deg);
    background:rgba(255,253,246,.92);
    box-shadow:inset 0 0 0 1px rgba(178,58,47,.35);
    user-select:none;
  }
  .seal span{padding:2px}
  .switch{margin-top:14px;font-family:var(--kai);font-size:14px}
  .switch a{color:var(--ink-2);text-decoration:none;border-bottom:1px dashed var(--ink-2)}
  .switch a:hover{color:var(--red);border-color:var(--red)}

  /* ===== 导航 ===== */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(246,241,228,.94);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--ink);
    margin-top:26px;
  }
  .tabs{max-width:940px;margin:0 auto;display:flex;align-items:center}
  .tab{
    flex:0 0 auto;padding:13px 18px 11px;cursor:pointer;
    font-family:var(--serif);font-size:16px;letter-spacing:.1em;
    color:var(--muted);border-bottom:3px solid transparent;position:relative;
    transition:color .18s;user-select:none;white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--red);font-weight:700}
  .tab.on::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:3px;background:var(--red);
  }
  .tab .n{
    display:inline-block;min-width:20px;padding:0 5px;margin-left:6px;
    font-family:var(--sans);font-size:11px;line-height:16px;border-radius:8px;
    background:#e9e2cd;color:var(--muted);vertical-align:2px;
  }
  .tab.on .n{background:var(--red);color:#fff}

  /* ===== 工具条 ===== */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:18px 0 4px;font-size:13px;color:var(--ink-2);
  }
  .toolbar .sp{flex:1}
  .chip{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px;cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--ink-2)}
  .chip.on{background:var(--ink);color:#f6f1e4;border-color:var(--ink)}
  .chip b{font-family:var(--serif);font-size:15px}
  .toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
  .toggle input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}
  .btn{
    font-family:var(--serif);font-size:13px;letter-spacing:.08em;cursor:pointer;
    border:1px solid var(--ink-2);background:var(--card);color:var(--ink);
    padding:5px 14px;border-radius:4px;transition:all .15s;user-select:none;
  }
  .btn:hover{background:var(--ink);color:#f6f1e4}
  .btn.warn{border-color:var(--red);color:var(--red)}
  .btn.warn:hover{background:var(--red);color:#fff}
  .pbar{height:6px;background:#e9e2cd;border-radius:3px;overflow:hidden;margin:10px 0 2px}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#4aa378);border-radius:3px;transition:width .3s}
  .hint{font-family:var(--kai);font-size:12.5px;color:var(--muted);margin:6px 0 0}

  /* ===== 章节 ===== */
  .chap{margin:26px 0 6px;display:flex;align-items:baseline;gap:10px}
  .chap h2{font-family:var(--serif);font-size:19px;letter-spacing:.08em;font-weight:700}
  .chap h2 .star{color:var(--red)}
  .chap .cp{font-size:12px;color:var(--muted)}
  .chap .cp b{color:var(--green);font-family:var(--serif)}

  .pt{
    background:var(--card);border:1px solid var(--line);
    border-left:4px solid var(--line);
    padding:14px 18px 12px;margin:10px 0;position:relative;
    box-shadow:0 3px 10px rgba(28,49,81,.05);
    display:flex;gap:12px;align-items:flex-start;
    transition:border-color .2s;
  }
  .pt.done{border-left-color:var(--green);background:linear-gradient(90deg,var(--green-bg),var(--card) 30%)}
  .dot{
    flex:0 0 auto;width:22px;height:22px;margin-top:4px;cursor:pointer;
    border:2px solid var(--muted);border-radius:50%;background:transparent;
    position:relative;user-select:none;
  }
  .dot:hover{border-color:var(--green)}
  .pt.done .dot{border-color:var(--green);background:var(--green)}
  .pt.done .dot::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:13px;font-weight:700;line-height:1;
  }
  .pt .bd{flex:1;min-width:0}
  .pt .k{font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:.02em;margin-bottom:2px}
  .pt.done .k{color:var(--muted)}
  .pt .v{font-size:14.5px;color:#2c3f5e}
  .kw{color:var(--red);font-weight:600;border-bottom:1px dashed rgba(178,58,47,.5)}
  body.recite .kw{
    background:var(--ink-2);color:transparent;border-bottom:none;
    border:1px dashed rgba(255,255,255,.4);
    border-radius:3px;padding:0 5px;cursor:pointer;user-select:none;
    transition:background .15s;
  }
  body.recite .kw:hover{background:var(--ink)}
  body.recite .kw.show{background:var(--red-bg);color:var(--red)}
  .pt.done .v{color:#6d7a8f}
  .empty{padding:40px 0;text-align:center;font-family:var(--kai);color:var(--muted)}

  footer{margin-top:44px;text-align:center;font-family:var(--kai);font-size:13px;color:var(--muted)}
  footer a{color:var(--ink-2);text-decoration:none;border-bottom:1px dashed var(--ink-2)}
  @media (max-width:560px){
    .pt{padding:12px 12px 10px}
    .toolbar{font-size:12px}
  }
</style>
</head>

<nav><div class="tabs" id="tabs"></div></nav>

<script>
/* ================= 数据 ================= */
var SUB=[
{id:"psy",name:"心理学",full:"高等教育心理学",chapters:[
{t:"第一章 概论",ps:[
{k:"研究对象",v:"高等教育情境中【学生的学】与【教师的教】的基本心理规律——既研究学，也研究教，不能只取一方。"},
{k:"高等教育的特点",v:"【专业性、高深性、创新性、职业性】；「基础性」是基础教育的特征，不属于高等教育特点。"},
{k:"观察法",v:"在【自然的教育情境】中有目的、有计划地记录行为表现，是最基本、最常用的研究方法。"},
{k:"实验法／调查法／个案法",v:"实验法【主动控制或改变条件】引起心理现象；调查法借问卷、访谈【间接】收集资料；个案法对【单一对象】深入、长期研究（如跟踪一位新教师三年）。"},
{k:"教育性（发展性）原则",v:"研究过程和结果都【不得损害】大学生、教师的身心健康与利益。"}
]},
{t:"第二章 教师心理",ps:[
{k:"教师成长三阶段（福勒和布朗）",v:"【关注生存→关注情境→关注学生】；能否【关注学生】（因材施教）是教师成熟的重要标志。"},
{k:"职业倦怠三维度",v:"【情绪耗竭（核心维度）】、去个性化（冷漠待人、把学生「当物一样」）、低个人成就感。"},
{k:"角色冲突 vs 角色超载",v:"冲突＝多种期望【相互矛盾】、难以兼顾；超载＝角色期望【过多】、超出时间与能力的承受范围。"},
{k:"教师威信",v:"形成后需要【维护与发展】：言行一致、完善专业能力、尊重学生、勇于自我批评；威信【可以重建】，但重建比维护更难。"},
{k:"专家型教师的特征",v:"教学效能感【高】、职业情感投入【深】、成就感【强】，职业倦怠（尤其情绪耗竭）显著更低。"}
]},
{t:"第三章 大学生心理发展特点",ps:[
{k:"皮亚杰认知发展四阶段",v:"【感知运动（0–2岁）→前运算（2–7岁）→具体运算（7–11、12岁）→形式运算（11、12岁以后）】，顺序不可颠倒、不可跨越。"},
{k:"大学生的认知发展",v:"处于【形式运算阶段】，【抽象逻辑思维】趋于成熟并占主导；思维的【独立性、批判性】明显增强，不盲从权威。"},
{k:"前运算阶段的特点",v:"【自我中心性】——难以站在他人视角看问题，「三山实验」是经典证据。"},
{k:"埃里克森：大学生的发展危机",v:"青年期（12–18岁）＝【自我同一性对角色混乱】；成年早期（18–25岁）＝【亲密感对孤独感】。"},
{k:"维果茨基「最近发展区」",v:"【现有发展水平】与【潜在发展水平】（成人指导下可达）之间的差距；教学应【走在发展的前面】，让学生「跳一跳，够得着」。"},
{k:"心理发展的特性",v:"关键期的存在体现【不平衡性】；个体之间能力、性格、思维风格各不相同体现【差异性】，要求因材施教。"}
]},
{t:"第四章 学习理论",ps:[
{k:"正强化／负强化／惩罚／消退",v:"正强化＝【呈现愉快刺激】使行为增多；负强化＝【撤销厌恶刺激】使行为增多；惩罚＝使行为【减少】；消退＝【撤除强化物】不予理睬（如对课堂怪相集体不理睬）。"},
{k:"负强化 ≠ 惩罚",v:"两者方向相反：负强化使行为【增加】，惩罚使行为【降低】——考试最爱挖的坑。"},
{k:"布鲁纳",v:"倡导【发现学习】，让学生主动探索、发现结论；主张掌握学科的【基本结构】（基本概念、原理及其关系）。"},
{k:"奥苏贝尔：有意义学习的实质",v:"新知识与原有认知结构中的适当观念建立【非人为的】（合乎逻辑）和【实质性的】（非字面）联系。"},
{k:"先行组织者",v:"先于学习任务呈现的【上位固着点】，为新的学习提供固着观念，促进新旧知识联系，实现有意义接受学习。"},
{k:"班杜拉：观察学习",v:"通过观察榜样的行为及其结果习得新行为，经历【注意→保持→再现→动机】四过程；强化分直接强化、【替代强化】（榜样被强化）与自我强化。"},
{k:"建构主义学习环境四要素",v:"【情境、协作、会话、意义建构】——学习应在真实情境中进行，意义建构是最终目标。"},
{k:"罗杰斯（人本主义）",v:"促进学习的三个心理气氛条件：【真诚一致、同理心（共情）、无条件积极关注】；倡导非指导性教学，反对权威与指令。"}
]},
{t:"第五章 知识的获得",ps:[
{k:"陈述性知识 vs 程序性知识",v:"陈述性知识回答【「是什么」】（北京是中国首都）；程序性知识回答【「怎么做」】（操作显微镜、编写程序），往往「只可意会难以言传」。"},
{k:"学习迁移",v:"【一种学习对另一种学习的影响】；「举一反三、闻一知十、触类旁通」都是典型的（正）迁移。"}
]},
{t:"第六章 思维与问题解决",ps:[
{k:"问题解决四阶段",v:"【发现问题→分析问题→提出假设→检验假设】；发现问题是起点，也是个体思维发展水平的重要标志。"},
{k:"功能固着",v:"只看到物体的【惯常功能】、想不到新用途（图钉盒只当容器、想不到当烛台）；是定势的特殊表现形式，阻碍问题解决。"}
]},
{t:"第七章 创造性",ps:[
{k:"创造性三特征",v:"【流畅性】（单位时间内想法的数量）、【变通性】（想法类别的多样性）、【独特性】（新颖独到、与众不同）。"},
{k:"智力与创造性的关系",v:"高智力是高创造性的【必要条件而非充分条件】；两者呈非线性关系——高创造性者智商一般中上，高智商不一定有高创造性。"}
]},
{t:"第八章 品德",ps:[
{k:"品德的心理结构（四要素）",v:"道德认知是【基础和核心】；道德情感是【动力】；道德意志是【精神力量】；道德行为是【最终目的】和衡量品德水平的【重要标志】。"},
{k:"科尔伯格三水平六阶段",v:"前习俗水平＝【服从与惩罚定向、工具性利己定向】；习俗水平＝【好孩子定向、维护社会秩序定向】；「好孩子定向」属于【习俗水平】。"},
{k:"德育疏导原则",v:"循循善诱、以理服人，从提高道德认识入手、因势利导，而【不是简单堵塞禁止】；德育要促进知行统一。"},
{k:"品德发展的特点",v:"具有【可塑性和反复性】，环境和教育的变化会引起品德变化——德育要长期坚持、正确对待反复。"}
]},
{t:"第十一章 学习动机",ps:[
{k:"耶克斯—多德森定律",v:"动机与效率呈【倒U型】关系；任务越难，最佳动机水平越【低】，任务容易则可偏高。"},
{k:"马斯洛需要层次",v:"由低到高：生理→安全→归属与爱→尊重→【自我实现】（最高）；前四种是【缺失性需要】，【求知、审美、自我实现】是成长性需要；层次并非绝对，可相互重叠。"},
{k:"麦克利兰成就需要理论",v:"三种后天需要：【成就需要】（追求卓越）、权力需要（影响支配他人）、亲和需要（建立友好关系）。"},
{k:"自我效能感（班杜拉）",v:"对自己【能否完成某一行为的主观判断】（「我能行」）；影响任务选择、努力与坚持性、思维模式和情绪反应。"},
{k:"韦纳归因理论",v:"能力＝【内部、稳定、不可控】；努力＝【内部、不稳定、可控】；任务难度＝外部、稳定；运气＝外部、不稳定；引导学生归因于【努力】最有利于激发后续动机。"}
]},
{t:"第十二章 课堂教学心理",ps:[
{k:"课堂心理气氛三类型",v:"【积极型】（最理想）、消极型、对抗紧张型；【民主型】领导易形成积极型气氛，专制型易致消极或对抗。"},
{k:"课堂管理的核心目标",v:"保障学生学习顺利进行、【培养自律能力】、优化课堂心理气氛——纪律只是手段之一而非全部。"},
{k:"高校高效教学模式",v:"【启发式、探究式、合作式】教学，突出学生主体地位；单向灌输不属于高效教学模式。"},
{k:"有效教学的特征",v:"目标明确、内容科学、方法适宜、互动充分、效果显著——【不是讲得越多、越难越有效】。"}
]}
]},

/* ================= 状态 ================= */
var KEY="liangxue_kaodian_v1";
var store={};
try{store=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){store={}}
function saveStore(){localStorage.setItem(KEY,JSON.stringify(store))}
function mkey(sub,ci,pi){return sub+"-"+ci+"-"+pi}

var cur=0;          /* 当前科目下标 */
var filter="all";   /* all | todo | done */

/* ================= 渲染 ================= */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
/* 把【】标记转成 .kw 节点 */
function fmt(s){
  return esc(s).replace(/【(.*?)】/g,function(m,t){return '<span class="kw">'+t+'</span>'});
}
function counts(si){
  var d=0,total=0;
  var s=SUB[si];
  for(var ci=0;ci<s.chapters.length;ci++){
    for(var pi=0;pi<s.chapters[ci].ps.length;pi++){
      total++;
      if(store[mkey(s.id,ci,pi)])d++;
    }
  }
  return {done:d,total:total};
}
function renderTabs(){
  var h="";
  for(var i=0;i<SUB.length;i++){
    var c=counts(i);
    h+='<div class="tab'+(i===cur?" on":"")+'" data-i="'+i+'">'+SUB[i].full
      +'<span class="n">'+c.done+'/'+c.total+'</span></div>';
  }
  document.getElementById("tabs").innerHTML=h;
}
function renderStat(){
  var c=counts(cur);
  document.getElementById("prog").innerHTML='已掌握 <b>'+c.done+'</b> / '+c.total+' 条';
  document.getElementById("pfill").style.width=(c.total?Math.round(c.done*100/c.total):0)+"%";
}
function renderPanel(){
  var s=SUB[cur],h="",shown=0;
  for(var ci=0;ci<s.chapters.length;ci++){
    var ch=s.chapters[ci];
    var cards="",d=0;
    for(var pi=0;pi<ch.ps.length;pi++){
      var p=ch.ps[pi];
      var done=!!store[mkey(s.id,ci,pi)];
      if(done)d++;
      if(filter==="todo"&&done)continue;
      if(filter==="done"&&!done)continue;
      cards+='<div class="pt'+(done?" done":"")+'" data-k="'+mkey(s.id,ci,pi)+'">'
        +'<span class="dot" title="打卡已掌握"></span>'
        +'<div class="bd"><div class="k">'+esc(p.k)+'</div><div class="v">'+fmt(p.v)+'</div></div>'
        +'</div>';
      shown++;
    }
    if(!cards)continue;
    h+='<div class="chap"><h2>'+esc(ch.t)+'</h2><span class="cp">已掌握 <b>'+d+'</b>/'+ch.ps.length+'</span></div>'+cards;
  }
  if(!shown)h='<div class="empty">这个筛选下没有考点了——很好，去另一科看看？</div>';
  document.getElementById("panel").innerHTML=h;
}
function render(){renderTabs();renderStat();renderPanel()}

/* ================= 交互 ================= */
document.getElementById("tabs").addEventListener("click",function(e){
  var t=e.target.closest(".tab");
  if(!t)return;
  cur=+t.dataset.i;
  render();
  window.scrollTo({top:0});
});

/* 打卡 / 墨块点击（原地更新，不重绘、不跳滚动） */
document.getElementById("panel").addEventListener("click",function(e){
  var kw=e.target.closest(".kw");
  if(kw){kw.classList.toggle("show");return}
  var dot=e.target.closest(".dot");
  if(!dot)return;
  var card=dot.closest(".pt");
  var k=card.dataset.k;
  if(store[k])delete store[k];else store[k]=1;
  saveStore();
  card.classList.toggle("done");
  renderTabs();renderStat();
  /* 更新所属章节的小计数 */
  var chEl=card.previousElementSibling;
  while(chEl&&!chEl.classList.contains("chap"))chEl=chEl.previousElementSibling;
  if(chEl){
    var ci=+k.split("-")[1];
    var ch=SUB[cur].chapters[ci];
    var dd=0;
    for(var pi=0;pi<ch.ps.length;pi++)if(store[mkey(SUB[cur].id,ci,pi)])dd++;
    var cp=chEl.querySelector(".cp");
    cp.innerHTML='已掌握 <b>'+dd+'</b>/'+ch.ps.length;
  }
});

/* 背诵模式：纯 CSS 切换，不打断当前滚动 */
document.getElementById("recite").addEventListener("change",function(){
  document.body.classList.toggle("recite",this.checked);
});

/* 筛选 */
document.querySelectorAll(".chip.f").forEach(function(c){
  c.addEventListener("click",function(){
    document.querySelectorAll(".chip.f").forEach(function(x){x.classList.remove("on")});
    c.classList.add("on");
    filter=c.dataset.f;
    renderPanel();
  });
});

document.getElementById("reset").addEventListener("click",function(){
  var s=SUB[cur];
  var c=counts(cur);
  if(!c.done)return;
  if(!confirm("确定清除《"+s.full+"》的全部掌握记录吗？"))return;
  var prefix=s.id+"-";
  for(var k in store)if(k.indexOf(prefix)===0)delete store[k];
  saveStore();
  render();
});

/* ================= 启动 ================= */
(function(){
  var total=0;
  SUB.forEach(function(s){s.chapters.forEach(function(ch){total+=ch.ps.length})});
  document.getElementById("totalN").textContent=total;
  render();
})();
</script>
