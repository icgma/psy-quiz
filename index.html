<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高等教育心理学 · 广东岗前培训刷题练习</title>
<style>
  :root{
    --ink:#1c3151;          /* 藏青 */
    --ink-2:#33517c;
    --paper:#f6f1e4;        /* 米纸 */
    --card:#fffdf6;
    --red:#b23a2f;          /* 朱砂 */
    --red-bg:#faecea;
    --green:#2f7d5b;        /* 竹青 */
    --green-bg:#eef6f0;
    --gold:#b98a2f;
    --muted:#8a7f66;
    --line:#d9cfb4;
    --serif:"Songti SC","STZhongsong","华文中宋","SimSun","宋体",serif;
    --kai:"KaiTi","STKaiti","楷体","BKaiKai",serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(rgba(28,49,81,.05) 1px, transparent 1.4px),
      linear-gradient(180deg,#f8f4e9 0%, var(--paper) 40%, #f3ecdb 100%);
    background-size:22px 22px, auto;
    min-height:100vh;
    line-height:1.75;
    padding:0 0 60px;
  }
  .wrap{max-width:940px;margin:0 auto;padding:0 16px}

  /* ===== 卷头 ===== */
  header{padding:34px 0 10px;text-align:center;position:relative}
  .paper-head{
    border:1px solid var(--ink);
    outline:1px solid var(--ink);
    outline-offset:5px;
    background:var(--card);
    padding:26px 20px 22px;
    position:relative;
    box-shadow:0 10px 28px rgba(28,49,81,.10);
  }
  .paper-head .sup{font-family:var(--serif);letter-spacing:.5em;color:var(--ink-2);font-size:13px;text-indent:.5em;margin-bottom:8px}
  .paper-head h1{font-family:var(--serif);font-size:clamp(24px,4.6vw,38px);letter-spacing:.14em;color:var(--ink);font-weight:700}
  .paper-head h1 .dot{color:var(--red);margin:0 .08em}
  .paper-head .sub{margin-top:10px;font-size:13px;color:var(--muted);font-family:var(--kai)}
  .paper-head .sub b{color:var(--ink-2)}
  .seal{
    position:absolute;right:14px;bottom:-16px;
    width:62px;height:62px;border:3px solid var(--red);border-radius:6px;
    color:var(--red);font-family:var(--kai);font-weight:700;
    display:grid;grid-template-columns:1fr 1fr;place-items:center;
    font-size:22px;line-height:1;transform:rotate(7deg);
    background:rgba(255,253,246,.92);
    box-shadow:inset 0 0 0 1px rgba(178,58,47,.35);
    user-select:none;
  }
  .seal span{padding:2px}

  /* ===== 导航 ===== */
  nav{
    position:sticky;top:0;z-index:50;
    background:rgba(246,241,228,.94);
    backdrop-filter:blur(6px);
    border-bottom:2px solid var(--ink);
    margin-top:26px;
  }
  .tabs{max-width:940px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:13px 18px 11px;cursor:pointer;
    font-family:var(--serif);font-size:16px;letter-spacing:.1em;
    color:var(--muted);border-bottom:3px solid transparent;position:relative;
    transition:color .18s;user-select:none;white-space:nowrap;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--red);font-weight:700}
  .tab.on::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-2px;height:3px;background:var(--red);
  }
  .tab .n{
    display:inline-block;min-width:20px;padding:0 5px;margin-left:6px;
    font-family:var(--sans);font-size:11px;line-height:16px;border-radius:8px;
    background:#e9e2cd;color:var(--muted);vertical-align:2px;
  }
  .tab.on .n{background:var(--red);color:#fff}

  /* ===== 统计条 ===== */
  .statbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:18px 0 4px;font-size:13px;color:var(--ink-2);
  }
  .statbar .chip{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
  .statbar .chip b{font-family:var(--serif);font-size:15px}
  .statbar .sp{flex:1}
  .btn{
    font-family:var(--serif);font-size:13px;letter-spacing:.08em;cursor:pointer;
    border:1px solid var(--ink-2);background:var(--card);color:var(--ink);
    padding:5px 14px;border-radius:4px;transition:all .15s;user-select:none;
  }
  .btn:hover{background:var(--ink);color:#f6f1e4}
  .btn.warn{border-color:var(--red);color:var(--red)}
  .btn.warn:hover{background:var(--red);color:#fff}
  .btn.mini{padding:2px 10px;font-size:12px}
  .toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;font-size:13px;color:var(--ink-2)}
  .toggle input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}

  /* ===== 题卡 ===== */
  .qcard{
    background:var(--card);border:1px solid var(--line);
    padding:20px 22px 18px;margin:16px 0;position:relative;
    box-shadow:0 3px 10px rgba(28,49,81,.05);
  }
  .qcard::before{
    content:"";position:absolute;top:0;left:0;width:100%;height:4px;
    background:linear-gradient(90deg,var(--ink) 0 34%,var(--red) 34% 36%,transparent 36%);
  }
  .qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
  .qno{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--red);white-space:nowrap}
  .qch{
    font-size:11px;font-family:var(--kai);color:var(--ink-2);
    border:1px solid var(--line);padding:1px 8px;border-radius:999px;background:#f7f2e2;white-space:nowrap;
  }
  .qtext{font-size:15.5px;font-weight:600;font-family:var(--serif);letter-spacing:.02em}

  .opts{margin-top:12px;display:grid;gap:8px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;padding:9px 12px;
    border:1px solid var(--line);border-radius:6px;background:#fffef9;
    cursor:pointer;transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--ink-2);background:#fdf9ec}
  .opt .L{
    flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-2);
    display:grid;place-items:center;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--ink-2);
    margin-top:2px;
  }
  .opt .T{font-size:14.5px}
  .locked .opt{cursor:default}
  .locked .opt:hover{border-color:var(--line);background:#fffef9}
  .opt.pick{border-color:var(--red);background:var(--red-bg)}
  .opt.pick .L{background:var(--red);border-color:var(--red);color:#fff}
  .opt.right{border-color:var(--green);background:var(--green-bg)}
  .opt.right .L{background:var(--green);border-color:var(--green);color:#fff}
  .opt.dim{opacity:.55}
  .locked .opt.right:hover{border-color:var(--green)}

  .fb{margin-top:12px;padding:10px 14px;border-radius:6px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
  .fb.ok{background:var(--green-bg);border:1px solid #cfe3d6;color:var(--green)}
  .fb.no{background:var(--red-bg);border:1px solid #e8c9c4;color:var(--red)}
  .fb .tag{font-family:var(--serif);font-weight:700;white-space:nowrap}

  .exp{
    margin-top:10px;border-left:3px solid var(--gold);
    background:#faf6e8;padding:10px 14px;font-size:13.5px;color:#6b5d33;
  }
  .exp .lb{font-family:var(--kai);font-weight:700;color:var(--gold);margin-right:6px}

  /* 判断题按钮 */
  .jbtns{display:flex;gap:14px;margin-top:12px}
  .jbtn{
    flex:1;max-width:200px;padding:10px 0;text-align:center;cursor:pointer;
    font-family:var(--kai);font-size:20px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
    border:1.5px solid var(--ink-2);border-radius:6px;color:var(--ink-2);background:#fffef9;
    transition:all .15s;user-select:none;
  }
  .jbtn:hover{background:#fdf9ec;border-color:var(--ink)}
  .locked .jbtn{cursor:default}
  .jbtn.pick{border-color:var(--red);color:var(--red);background:var(--red-bg)}
  .jbtn.right{border-color:var(--green);color:var(--green);background:var(--green-bg)}

  /* 主观题 */
  .mat{
    margin-top:12px;background:#fbf7ec;border:1px dashed var(--line);
    padding:14px 16px;font-size:14px;color:#4a4433;
  }
  .mat .lb{font-family:var(--kai);font-weight:700;color:var(--muted);margin-right:6px}
  .qs{margin-top:10px;font-size:14.5px;font-weight:600;font-family:var(--serif)}
  .sheet{
    width:100%;margin-top:12px;border:1px solid var(--line);background:#fff;
    background-image:repeating-linear-gradient(transparent,transparent 31px,#efe7d0 32px);
    line-height:32px;padding:0 12px;font-family:var(--sans);font-size:14px;color:var(--ink);
    min-height:132px;resize:vertical;outline:none;
  }
  .sheet:focus{border-color:var(--ink-2)}
  .refbtns{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ref{
    margin-top:12px;border:1px solid #cfe3d6;background:var(--green-bg);
    border-radius:6px;padding:14px 16px;font-size:14px;
  }
  .ref .lb{font-family:var(--kai);font-weight:700;color:var(--green)}
  .ref ul{margin:8px 0 4px 0;padding-left:20px}
  .ref li{margin:4px 0}
  .ref .demo{margin-top:8px;padding-top:8px;border-top:1px dashed #bcd6c8;font-size:13.5px;color:#3f6653}
  .selfmark{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
  .selfmark .btn{font-size:12.5px}
  .selfmark .btn.did{background:var(--green);border-color:var(--green);color:#fff}
  .selfmark .btn.again{background:var(--red);border-color:var(--red);color:#fff}

  .redo{margin-top:10px}
  .redo .btn{font-size:12px}

  /* 首页考情 */
  .hero{margin-top:22px}
  .note{
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);
    padding:16px 20px;margin:14px 0;font-size:14px;
  }
  .note h3{font-family:var(--serif);font-size:16px;margin-bottom:8px;letter-spacing:.06em}
  .note h3 .no{
    display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
    background:var(--red);color:#fff;font-size:12px;font-family:var(--sans);margin-right:8px;vertical-align:-3px;
  }
  .note p,.note li{font-size:14px;color:#454f60}
  .note ul{padding-left:20px;margin-top:6px}
  .note li{margin:4px 0}
  .note b{color:var(--ink)}
  .note .k{color:var(--red);font-weight:700}
  .note table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
  .note th,.note td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .note th{background:#f3ecd9;font-family:var(--serif)}
  .src{font-size:12px;color:var(--muted);font-family:var(--kai);margin-top:10px}

  .done-tip{font-family:var(--kai);color:var(--green);font-size:14px;margin-top:12px;display:flex;gap:8px;align-items:center}
  .summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px;
  }
  .scard{background:var(--card);border:1px solid var(--line);padding:14px 16px;text-align:center}
  .scard .t{font-family:var(--kai);font-size:13px;color:var(--muted)}
  .scard .v{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);margin-top:4px}
  .scard .v small{font-size:13px;color:var(--muted);font-weight:400}
  .scard.red .v{color:var(--red)}

  footer{margin-top:40px;text-align:center;font-family:var(--kai);font-size:13px;color:var(--muted)}
  footer .line{width:120px;height:1px;background:var(--line);margin:12px auto}

  @media (max-width:600px){
    .qcard{padding:16px 14px}
    .paper-head{padding:22px 14px 20px}
    .seal{width:50px;height:50px;font-size:17px;right:8px;bottom:-14px}
    .jbtns{gap:10px}
    .statbar .chip{font-size:12px;padding:3px 10px}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="paper-head">
      <div class="sup">广东省高校教师岗前培训</div>
      <h1>高等教育心理学<span class="dot">·</span>刷题练习卷</h1>
      <div class="sub">教材依据：张积家主编《高等教育心理学》（第二版）· 高等教育出版社<br>题型：<b>单选 · 判断 · 举例说明 · 案例分析</b>　全卷共 <b id="totalN">--</b> 题</div>

  </div>
</header>

<nav><div class="tabs" id="tabs"></div></nav>

<main class="wrap">
  <div class="statbar" id="statbar"></div>
  <div id="panel"></div>
</main>

<footer>
  <div class="line"></div>
  岗前培训「两学」闭卷 · 认真作答 · 逢考必过<br>

<script>
/* ================= 题库数据 ================= */
var SINGLE=[
{ch:"第一章 概论",q:"下列选项中，不属于高等教育特点的是（　）。",o:["专业性","高深性","基础性","职业性"],a:2,e:"高等教育的特点包括专业性、高深性、创新性和职业性；「基础性」是基础教育的特征。"},
{ch:"第一章 概论",q:"高等教育心理学的研究对象是（　）。",o:["高校教师的心理现象","大学生的心理发展规律","高校情境中学生的学与教师的教的基本心理规律","高等教育教学过程本身的规律"],a:2,e:"高等教育心理学研究的是高等教育情境中「教与学」双方的心理规律，既包括学生的学，也包括教师的教，不能只取一方。"},
{ch:"第一章 概论",q:"研究者在自然的教育情境中，有目的、有计划地通过感官或仪器记录学生的行为表现，从而研究其心理规律，这种方法是（　）。",o:["实验法","观察法","调查法","个案法"],a:1,e:"观察法是在自然条件下有目的、有计划地记录被试行为，是最基本、最常用的方法；实验法需控制和改变条件，调查法借助问卷、访谈等间接收集资料。"},
{ch:"第一章 概论",q:"某研究者对一位教学困难的新教师进行了为期三年的深入跟踪研究，全面分析其成长过程。这种研究方法是（　）。",o:["个案法","观察法","实验法","调查法"],a:0,e:"个案法是对单一对象（个人或少数个体）进行深入、详尽、长期的研究，常用于教师成长、问题学生等研究。"},
{ch:"第二章 教师心理",q:"福勒和布朗提出的教师成长三阶段，正确的发展顺序是（　）。",o:["关注学生→关注生存→关注情境","关注生存→关注情境→关注学生","关注情境→关注生存→关注学生","关注生存→关注学生→关注情境"],a:1,e:"教师专业成长依次经历关注生存阶段（人际关系与适应）、关注情境阶段（成绩、进度、备课质量）、关注学生阶段（个体差异、因材施教）。能否关注学生是教师成熟的重要标志。"},
{ch:"第二章 教师心理",q:"新教师张老师最关心的问题是“学生喜不喜欢我”“领导和同事怎么看我”。按照教师成长阶段理论，张老师处于（　）。",o:["关注学生阶段","关注情境阶段","关注生存阶段","关注自我阶段"],a:2,e:"关注自身生存适应、人际关系和被接纳程度，是关注生存阶段的典型表现。"},
{ch:"第二章 教师心理",q:"教师职业倦怠三个维度中，最核心、最具指标性的维度是（　）。",o:["去个性化","情绪耗竭","低个人成就感","角色超载"],a:1,e:"情绪耗竭指情绪资源被耗尽、感到疲惫不堪，是职业倦怠的核心维度，并伴随去个性化（冷漠待人）和低个人成就感。"},
{ch:"第二章 教师心理",q:"李老师近来越来越对学生冷漠、疏远，把学生“当物一样”对待，对学生问题漠不关心。这属于职业倦怠中的（　）。",o:["情绪耗竭","去个性化","低个人成就感","角色冲突"],a:1,e:"去个性化表现为以消极、否定、麻木不仁的态度对待服务对象（学生），是情绪耗竭之后常出现的维度。"},
{ch:"第三章 心理特点",q:"皮亚杰认知发展四阶段的正确顺序是（　）。",o:["感知运动阶段→前运算阶段→具体运算阶段→形式运算阶段","前运算阶段→感知运动阶段→具体运算阶段→形式运算阶段","感知运动阶段→具体运算阶段→前运算阶段→形式运算阶段","前运算阶段→具体运算阶段→感知运动阶段→形式运算阶段"],a:0,e:"皮亚杰四阶段依次为感知运动（0-2岁）、前运算（2-7岁）、具体运算（7-11、12岁）、形式运算（11、12岁以后），顺序不可颠倒、不可跨越。"},
{ch:"第三章 心理特点",q:"大学生的认知发展一般处于皮亚杰所说的（　）。",o:["具体运算阶段","形式运算阶段","前运算阶段","感知运动阶段"],a:1,e:"形式运算阶段以抽象逻辑思维和假设演绎推理为特征；大学生抽象逻辑思维趋于成熟并占主导地位。"},
{ch:"第三章 心理特点",q:"埃里克森认为，成年早期（约18-25岁，大学生所处时期）面临的发展危机是（　）。",o:["勤奋感对自卑感","自我同一性对角色混乱","亲密感对孤独感","繁殖感对停滞感"],a:2,e:"青年期（12-18岁）的核心危机是自我同一性对角色混乱；成年早期（18-25岁）的任务是建立亲密感、避免孤独感。大学生仍在继续巩固自我同一性。"},
{ch:"第三章 心理特点",q:"维果茨基所说的“最近发展区”是指（　）。",o:["个体当前已经达到的发展水平","个体未来可能达到的最高发展水平","个体现有水平与在成人指导下可能达到的较高水平之间的差距","个体天生的遗传潜能"],a:2,e:"最近发展区是“现有发展水平”与“潜在发展水平”之间的区域，即“已经成熟”与“尚未成熟但可达成”的差距，教学应立足这一区域。"},
{ch:"第三章 心理特点",q:"“教学应走在发展的前面。”依据这一主张，教师在教学中应当（　）。",o:["只教学生已经会的内容","把教学难度定得远远超过学生水平","立足最近发展区，给学生适度的挑战和支架","等学生完全成熟之后再进行教学"],a:2,e:"维果茨基主张教学引领发展：教学内容应略高于现有水平、落在最近发展区内，通过支架式帮助使学生“跳一跳，够得着”。"},
{ch:"第三章 心理特点",q:"2岁左右是口语发展的关键期，错过了语言刺激会导致发展受损。这说明个体心理发展具有（　）。",o:["顺序性","阶段性","不平衡性","差异性"],a:2,e:"同一心理机能在不同时期发展速度和成熟水平不同（存在关键期），体现的是不平衡性；差异性指个体之间各不相同。"},
{ch:"第三章 心理特点",q:"“有的学生擅长形象思维，有的学生擅长抽象逻辑思维”，教学中应因材施教。这体现心理发展的（　）。",o:["顺序性","阶段性","不平衡性","差异性"],a:3,e:"个体之间在能力、性格、思维风格等方面存在差异，属于个别差异性，要求教育因材施教。"},
{ch:"第三章 心理特点",q:"大学生不满足于教材和教师的现成结论，喜欢独立思考、大胆质疑、与人争辩。这反映了大学生（　）。",o:["思维的独立性和批判性增强","思维的依赖性","思维的直观性","思维的表面性"],a:0,e:"大学生抽象逻辑思维成熟，思维独立性、批判性明显增强，不再盲从权威，是重要的大学生认知特点。"},
{ch:"第四章 学习理论",q:"学生连续一周按时交作业后，教师撤销了对他的“课后留堂”处理，此后该生按时交作业的次数明显增多。这一做法属于（　）。",o:["正强化","负强化","惩罚","消退"],a:1,e:"负强化是撤销（排除）厌恶刺激从而使行为频率增加；正强化是呈现愉快刺激；“留堂”是厌恶刺激，撤销它强化了按时交作业的行为。"},
{ch:"第四章 学习理论",q:"学生上课频繁玩手机，教师没收其手机一周，以期减少该行为。这属于（　）。",o:["正强化","负强化","惩罚","替代强化"],a:2,e:"惩罚是呈现厌恶刺激（或撤销愉快刺激）以降低行为频率。没收手机是呈现厌恶刺激，目的是减少上课玩手机行为。"},
{ch:"第四章 学习理论",q:"布鲁纳认为，学生学习的最好方式是（　）。",o:["接受学习","发现学习","机械学习","观察学习"],a:1,e:"布鲁纳倡导发现学习，让学生像科学家一样主动探索、发现结论，并主张掌握学科的基本结构（基本概念、原理及其关系）。"},
{ch:"第四章 学习理论",q:"奥苏贝尔认为，有意义学习的实质是（　）。",o:["把教师讲授的内容完整记住","新知识与原有认知结构中已有的适当观念建立非人为的、实质性的联系","通过反复诵读形成刺激—反应联结","通过尝试错误逐步获得经验"],a:1,e:"有意义接受学习的实质是新旧知识之间建立「非人为的」（合乎逻辑的）和「实质性的」（非字面的）联系，而非机械记忆。"},
{ch:"第四章 学习理论",q:"师范生通过观摩优秀教师的教学录像学会课堂提问技巧。按照班杜拉的理论，这属于（　）。",o:["强化学习","观察学习","机械学习","发现学习"],a:1,e:"观察学习（社会学习）是通过观察榜样的行为及其结果而习得新行为，不需要亲自体验强化，经历注意、保持、再现、动机四个过程。"},
{ch:"第四章 学习理论",q:"建构主义认为，理想的学习环境包含四大要素，即（　）。",o:["教师、教材、教室、考试","情境、协作、会话、意义建构","预习、听讲、作业、复习","目标、内容、方法、评价"],a:1,e:"建构主义学习环境四要素：情境（学习应在真实情境中进行）、协作、会话（交流讨论）、意义建构（最终目标）。"},
{ch:"第四章 学习理论",q:"罗杰斯提出的促进学习的心理气氛条件不包括（　）。",o:["真诚一致","同理心（共情）","无条件积极关注","权威与指令"],a:3,e:"人本主义心理学家罗杰斯主张教师以真诚、同理心、无条件积极关注对待学生，倡导非指导性教学，反对权威压制。"},
{ch:"第五章 知识获得",q:"“知道北京是中国的首都”属于陈述性知识，而“会操作显微镜、会编写程序”属于（　）。",o:["陈述性知识","程序性知识","条件性知识","事实性知识"],a:1,e:"陈述性知识回答“是什么”，能被陈述；程序性知识回答“怎么做”，通过实际操作表现出来，往往“只可意会难以言传”。"},
{ch:"第五章 知识获得",q:"学习数学有利于学习物理，学生能“举一反三、触类旁通”。这种现象是（　）。",o:["知识保持","知识迁移","知识遗忘","知识同化"],a:1,e:"一种学习对另一种学习的影响即迁移；“举一反三、闻一知十、触类旁通”都是典型的（正）迁移现象。"},
{ch:"第六章 思维与问题解决",q:"问题解决过程的第一个阶段是（　）。",o:["提出假设","发现问题","分析问题","检验假设"],a:1,e:"问题解决依次经历：发现问题→分析问题→提出假设→检验假设。发现问题是起点，也是个体思维发展水平的重要标志。"},
{ch:"第六章 思维与问题解决",q:"解决“把蜡烛固定在墙上”的问题时，只想到图钉盒是容器而想不到把它当烛台。这种心理障碍是（　）。",o:["定势","功能固着","负迁移","顿悟"],a:1,e:"功能固着指只看到物体的惯常功能、不能发现其新用途，是定势的特殊表现形式，阻碍问题解决。"},
{ch:"第七章 创造性",q:"要求被试在一分钟内尽可能多地说出“砖头的用途”，测量的是创造性的（　）。",o:["流畅性","变通性","独特性","精细性"],a:0,e:"流畅性指单位时间内产生想法的数量；变通性指想法类别的多样性（跨越不同领域）；独特性指想法新颖独到、与众不同。"},
{ch:"第八章 品德",q:"品德的心理结构中，衡量个体品德水平高低的重要标志是（　）。",o:["道德认知","道德情感","道德意志","道德行为"],a:3,e:"道德认知（认识）是品德形成的基础和核心，道德情感是动力，道德意志是精神力量，道德行为是品德形成的最终目的，是衡量品德水平的重要标志。"},
{ch:"第八章 品德",q:"科尔伯格道德发展阶段理论中，“好孩子定向”阶段属于（　）。",o:["前习俗水平","习俗水平","后习俗水平","超习俗水平"],a:1,e:"习俗水平（第二水平）包括“好孩子定向”（寻求认可）和“维护社会秩序定向”两阶段；“服从与惩罚定向”“工具性目的定向”属前习俗水平。"},
{ch:"第十一章 动机",q:"根据耶克斯—多德森定律，完成复杂、困难的学习任务时，最佳动机水平应（　）。",o:["偏高一些","偏低一些","中等偏高","越强越好"],a:1,e:"动机与效率呈倒U型关系，最佳动机水平随任务难度而变化：任务越难，最佳动机水平越低；任务越容易，最佳动机水平可偏高。"},
{ch:"第十一章 动机",q:"马斯洛需要层次理论中，最高层次的需要是（　）。",o:["尊重的需要","归属与爱的需要","自我实现的需要","求知的需要"],a:2,e:"由低到高依次为：生理→安全→归属与爱→尊重→自我实现（教材另有求知、审美等层次），自我实现是最高层次的成长性需要。"},
{ch:"第十一章 动机",q:"麦克利兰成就需要理论认为，个体追求卓越、希望把事情做得更好、争取成功的内在需要是（　）。",o:["权力需要","亲和（社交）需要","成就需要","生存需要"],a:2,e:"麦克利兰提出人有三種后天需要：成就需要（追求卓越）、权力需要（影响支配他人）、亲和需要（建立友好关系）。高成就需要者更愿意承担适度挑战性任务。"},
{ch:"第十一章 动机",q:"班杜拉提出的“自我效能感”是指（　）。",o:["个体对成功客观概率的评估","个体对自己能否完成某一行为的主观判断","个体的自尊水平","个体的一般能力倾向"],a:1,e:"自我效能感是“我能行”的主观判断，而非能力本身；它影响任务选择、努力程度、坚持性和情绪反应（如考试焦虑）。"},
{ch:"第十一章 动机",q:"韦纳归因理论中，“能力”属于（　）的因素。",o:["内部、稳定、不可控","内部、不稳定、可控","外部、稳定、不可控","外部、不稳定、可控"],a:0,e:"能力是内部、稳定、不可控因素；努力是内部、不稳定、可控因素；任务难度、运气是外部因素（运气不稳定，任务难度相对稳定）。"},
{ch:"第十二章 教学心理",q:"课堂心理气氛的三种类型中，最理想的是（　）。",o:["积极型","消极型","对抗紧张型","放任型"],a:0,e:"课堂心理气氛分积极型、消极型、对抗紧张型三类；积极型课堂师生关系和谐、学生参与度高，是教学的理想状态。"},
{ch:"第十二章 教学心理",q:"高校高效教学的常用模式不包括（　）。",o:["启发式教学","探究式教学","合作式教学","单向灌输式教学"],a:3,e:"高校高效教学模式强调启发式、探究式、合作式教学，突出学生主体地位；单向灌输忽视学生的主动意义建构，不属于高效教学模式。"},
{ch:"第十二章 教学心理",q:"下列不属于有效教学特征的是（　）。",o:["目标明确、内容科学","方法适宜、互动充分","一节课讲授的内容越多越难越有效","效果显著、达成教学目标"],a:2,e:"有效教学的特征包括目标明确、内容科学、方法适宜、互动充分、效果显著；容量过大超出学生接受范围反而降低效果，关键是促进学生的有意义学习。"},
{ch:"第二章 教师心理",q:"王老师同时面对多种相互矛盾的期望：学校要求他严格管理，学生希望他做“朋友”，家里需要他照顾孩子。他感到左右为难、动辄得咎。这种状况属于（　）。",o:["角色冲突","角色超载","角色模糊","角色退化"],a:0,e:"角色冲突指个体同时面临多种相互矛盾、难以兼顾的角色期望；角色超载则是角色期望过多、超出时间与能力的承受范围。"},
{ch:"第二章 教师心理",q:"李老师每周12节课，还兼任班主任、科研考核、指导竞赛、行政值班，感到时间和精力完全不够用。这属于（　）。",o:["角色冲突","角色超载","角色认同","角色期待"],a:1,e:"角色超载指角色期望过多、超出个人承受能力；调适需要角色排序、时间管理以及组织层面的合理减负。"},
{ch:"第二章 教师心理",q:"教师威信与“威严”的根本区别在于，威信使学生（　）。",o:["因惧怕惩罚而服从","发自内心地信服、敬佩并认同","因成绩利益而顺从","因从众压力而跟随"],a:1,e:"威信是学生发自内心的信服与尊敬，靠人格、学识和教学能力树立；威严则依赖强制，学生慑服而非信服。"},
{ch:"第一章 概论",q:"高等教育心理学研究中，要求研究应有利于被试的身心发展、不能因研究损害被试利益的原则是（　）。",o:["客观性原则","系统性原则","教育性原则","理论联系实际原则"],a:2,e:"教育性（发展性）原则要求把研究与教育统一起来，研究过程与结果都不损害大学生、教师的身心发展与利益。"},
{ch:"第一章 概论",q:"与观察法相比，实验法的根本特点在于（　）。",o:["在完全自然的情境中进行","被动地记录被试行为","主动控制或创设条件，引起并考察心理现象","通过问卷间接收集资料"],a:2,e:"实验法的特点是主动控制和改变条件（自变量），引起并测量心理现象（因变量）；观察法在自然情境中进行，调查法通过问卷、访谈等间接收集资料。"},
{ch:"第一章 概论",q:"研究者通过问卷、访谈等方式间接收集资料，了解大学生的学习动机状况。这种方法是（　）。",o:["观察法","实验法","调查法","个案法"],a:2,e:"调查法的基本特点是通过问卷、访谈、作品分析等间接方式收集资料，适合大范围了解现状；个案法是对少数对象的深入研究。"},
{ch:"第三章 心理特点",q:"“教育要循序渐进，不能拔苗助长。”这体现了心理发展的（　）。",o:["顺序性","阶段性","不平衡性","差异性"],a:0,e:"顺序性指心理发展由低级到高级、由简单到复杂，不可逾越、不可逆，要求教育循序渐进。"},
{ch:"第三章 心理特点",q:"心理发展的阶段性要求教育者（　）。",o:["针对不同发展阶段采取不同教育措施，不能“一刀切”","对所有年龄学生采用同一模式","尽可能加速发展进程","只关注发展的关键期"],a:0,e:"不同阶段有质的不同，教育要从学生实际出发，针对阶段特点施教，既不“成人化”也不“儿童化”。"},
{ch:"第三章 心理特点",q:"大学生自我意识发展中最核心的矛盾是（　）。",o:["自尊与自卑的矛盾","理想自我与现实自我的矛盾","交往需要与闭锁性的矛盾","求知需要与厌倦的矛盾"],a:1,e:"大学生自我意识具有独立、敏感、矛盾、追求自我统一的特点，其中理想自我与现实自我的差距是最核心的矛盾，促使个体追求自我同一。"},
{ch:"第三章 心理特点",q:"心理发展的不平衡性对教育的启示是（　）。",o:["抓住发展的关键期，及时施教","等学生完全成熟后再进行教育","对各年龄阶段平均使用力量","完全顺应自然，不加干预"],a:0,e:"同一心理机能在不同时期发展速度不同并存在关键期（如口语发展关键期），要求教育抓住时机、及时施教。"},
{ch:"第五章 知识获得",q:"知识学习的基本过程依次是（　）。",o:["获得→保持→迁移应用","感知→理解→巩固","学习→复习→考试","识记→再认→回忆"],a:0,e:"知识学习经历获得（理解新知识）、保持（储存防遗忘）、迁移应用（应用于新情境）三个基本环节。"},
{ch:"第五章 知识获得",q:"为促进知识迁移，教师在选择和组织教材内容时应（　）。",o:["内容尽量多而全","精选具有广泛迁移价值的基本概念、基本原理","只选学科最前沿成果","只选考试常考内容"],a:1,e:"基本概念和原理具有广泛的迁移价值（概括化理论）；此外还应合理编排教学内容、合理安排教学程序、教授学习策略。"},
{ch:"第四章 学习理论",q:"学生看到同伴因助人受到教师表扬后，自己也更愿意帮助别人。这属于（　）。",o:["直接强化","替代强化","自我强化","负强化"],a:1,e:"替代强化是观察者因看到榜样受强化而受到的强化，是观察学习的重要动机机制；自我强化是依据自己设定的标准评价和强化自己。"},
{ch:"第四章 学习理论",q:"奥苏贝尔提出的“先行组织者”是指（　）。",o:["在学习任务之前呈现的引导性材料","学习结束后呈现的总结材料","组织学生分组讨论的活动","课堂纪律管理者"],a:0,e:"先行组织者是先于学习任务本身呈现的、比学习任务具有更高抽象概括水平的引导性材料，为新的学习提供固着点，促进有意义接受学习。"},
{ch:"第四章 学习理论",q:"布鲁纳认为，无论选教什么学科，务必使学生理解并掌握（　）。",o:["尽可能多的事实性知识","学科的基本结构","教师最新的研究成果","各类解题技巧"],a:1,e:"布鲁纳的结构主义课程观主张学习学科的基本结构（基本概念、基本原理及其相互关系），并倡导发现学习。"},
{ch:"第八章 品德",q:"科尔伯格研究道德发展所采用的方法是（　）。",o:["对偶故事法","道德两难故事法","问卷调查法","自然实验法"],a:1,e:"科尔伯格以“海因茨偷药”等道德两难故事研究个体的道德判断，据此提出三水平六阶段理论；对偶故事法是皮亚杰研究道德判断的方法。"},
{ch:"第八章 品德",q:"学生改正了错误行为后不久又犯，教师应当认识到这体现了品德发展的（　）。",o:["渐进性","反复性","可塑性","稳定性"],a:1,e:"品德发展具有渐进性、反复性和可塑性，出现反复是正常现象，教育者应坚持长期引导、反复抓、抓反复。"},
{ch:"第十一章 动机",q:"麦克利兰的研究发现，高成就需要者最喜欢的任务难度是（　）。",o:["非常容易的任务","几乎不可能完成的任务","成功概率约为50%的适度挑战性任务","完全随机的任务"],a:2,e:"高成就需要者追求卓越、回避极端，最偏好成功与失败各占一半的适度难度任务——太容易无成就感，太难则无成功期望。"},
{ch:"第十一章 动机",q:"马斯洛需要层次中，属于成长性需要的是（　）。",o:["生理需要","安全需要","尊重需要","自我实现需要"],a:3,e:"生理、安全、归属与爱、尊重属缺失性需要（满足后强度降低）；求知、审美、自我实现属成长性需要（满足后进一步增强）。"},
{ch:"第十二章 教学心理",q:"课堂上学生心不在焉、反应冷淡、无精打采，教师也敷衍了事。这种课堂心理气氛属于（　）。",o:["积极型","消极型","对抗紧张型","放任型"],a:1,e:"消极型课堂的特征是学生态度消极、兴趣缺乏、心不在焉，师生关系疏离；对抗紧张型则表现为课堂失控、师生对立。"},
{ch:"第二章 教师心理",q:"与非专家型教师相比，下列不属于专家型教师特征的是（　）。",o:["高效率地解决教学领域的问题","拥有丰富而有效的专门知识","具有创造性的洞察力","更依赖外部评价标准"],a:3,e:"专家型教师的特征：高效率解决教学领域问题、丰富而有效的专门知识、创造性的洞察力；其职业倦怠水平也显著低于新手型和熟手型教师。"},
{ch:"第四章 学习理论",q:"大学生学习特点中的“专业性”意味着（　）。",o:["学习围绕专业方向和职业需要展开","只学本专业的内容即可","学习安排完全由教师决定","学习内容一成不变"],a:0,e:"大学生的学习围绕专业培养目标展开，同时具有自主性、探究性、创造性、实践性；专业性不等于狭窄性，仍需拓宽基础。"},
{ch:"第一章 概论",q:"高等教育心理学的研究要从实际出发，实事求是地反映心理现象的本来面貌，并以实践作为检验研究结果的标准。这体现的研究原则是（　）。",o:["客观性原则","系统性原则","教育性原则","理论联系实际原则"],a:0,e:"客观性原则要求从实际出发、实事求是，防止主观臆断；系统性原则要求把心理现象作为整体系统考察；教育性原则要求研究不损害被试利益。"},
{ch:"第一章 概论",q:"把高校师生的心理活动视为相互联系、相互影响的整体系统加以考察，反对孤立、片面地研究心理现象。这体现（　）。",o:["客观性原则","系统性原则","教育性原则","理论联系实际原则"],a:1,e:"系统性原则强调心理现象是多层次、多水平的整体，各因素相互联系，必须用整体、联系、发展的观点加以研究。"},
{ch:"第二章 教师心理",q:"与专家型教师相比，新手型教师的典型表现是（　）。",o:["备课和教学灵活多变、富有创造性","对课堂事件的解释更深刻","教学按部就班，缺乏教学策略的灵活性","能较好预测和处理课堂突发问题"],a:2,e:"新手型教师关注教学常规和课堂纪律，依赖既定程序，缺乏灵活性；专家型教师则以丰富经验高效率解决教学问题、具有创造性洞察力。"},
{ch:"第二章 教师心理",q:"下列做法中有利于建立教师威信的是（　）。",o:["对学生严厉苛刻，令其敬畏","言行一致、精通专业、真诚关爱学生","无条件迎合学生的一切要求","与学生称兄道弟、不讲原则"],a:1,e:"威信来自人格魅力、专业水平和真诚的师生关系；严厉只能造成“威严”而非“威信”，迎合与放任则会丧失教育性。"},
{ch:"第三章 心理特点",q:"埃里克森认为，6-12岁（儿童期/小学阶段）面临的发展危机是（　）。",o:["自主感对羞怯感","勤奋感对自卑感","同一性对角色混乱","亲密感对孤独感"],a:1,e:"该阶段儿童的主要任务是获得勤奋感、避免自卑感；同一性对角色混乱属青年期（12-18岁），亲密对孤独属成年早期。"},
{ch:"第三章 心理特点",q:"自我意识的心理成分包括（　）。",o:["自我认知、自我体验、自我调控","本我、自我、超我","知情意行","生理自我、社会自我、心理自我"],a:0,e:"自我意识含自我认知（认识）、自我体验（情感，如自尊、自信）和自我调控（意志，如自我监督、自我激励）三种成分。"},
{ch:"第四章 学习理论",q:"“支架式教学”为学生提供帮助并在其能力提高后逐步撤除，其理论基础是（　）。",o:["斯金纳的强化理论","维果茨基的最近发展区理论","奥苏贝尔的有意义学习理论","托尔曼的符号学习理论"],a:1,e:"支架式教学源于维果茨基最近发展区思想：教学落在“现有水平”与“潜在水平”之间，通过支架帮助学生穿越最近发展区后撤除支架。"},
{ch:"第四章 学习理论",q:"学生课堂上做怪相以引起注意，教师和同学故意不予理睬，其怪相行为逐渐减少。这属于（　）。",o:["正强化","负强化","惩罚","消退"],a:3,e:"曾经被强化（引人发笑/关注）的行为不再得到强化物，行为频率逐渐下降，这是消退；消退不同于惩罚（呈现厌恶刺激）。"},
{ch:"第四章 学习理论",q:"班杜拉认为观察学习要经历四个过程，正确的顺序是（　）。",o:["注意→保持→动作再现→动机","注意→动机→保持→动作再现","保持→注意→动作再现→动机","动机→注意→保持→动作再现"],a:0,e:"观察（榜样）学习经注意、保持（记忆储存）、动作再现（练习转化为行动）、动机（因强化而产生行为意愿）四个过程完成。"},
{ch:"第四章 学习理论",q:"建构主义知识观认为（　）。",o:["知识是客观的、确定的，学习就是获得这些知识","知识不是对现实的绝对准确表征，学习者要对其主动建构","知识只能通过讲授传递","个人经验与知识学习无关"],a:1,e:"建构主义强调知识不是绝对真理的表征，学习是学习者基于原有经验在情境中主动建构意义的过程，不能被动接受灌输。"},
{ch:"第四章 学习理论",q:"提出以学生为中心、倡导“非指导性教学”的人本主义心理学家是（　）。",o:["马斯洛","罗杰斯","康布斯","珀金斯"],a:1,e:"罗杰斯提出非指导性教学，主张教师以真诚一致、同理心、无条件积极关注的态度促进学生学习；马斯洛同为人本主义代表，重在需要层次理论。"},
{ch:"第五章 知识获得",q:"先学会骑自行车后，学骑摩托车变得更容易；而方言口音却干扰了普通话学习。后一种现象属于（　）。",o:["正迁移","负迁移","顺向迁移","水平迁移"],a:1,e:"一种学习对另一种学习起阻碍（干扰）作用为负迁移；起促进作用为正迁移（如骑自行车→骑摩托车）。"},
{ch:"第五章 知识获得",q:"下列选项中，属于程序性知识的是（　）。",o:["知道辛亥革命发生于1911年","会骑自行车","背诵《静夜思》","了解光折射定律的内容"],a:1,e:"程序性知识回答“怎么做”，通过操作表现（如骑车）；其余三项均为可以言传的陈述性知识（“是什么”）。"},
{ch:"第六章 思维与问题解决",q:"问题解决过程的四个阶段，完整而正确的顺序是（　）。",o:["发现问题→分析问题→提出假设→验证假设","发现问题→提出假设→分析问题→验证假设","分析问题→发现问题→提出假设→验证假设","提出假设→分析问题→发现问题→验证假设"],a:0,e:"发现问题（首要环节）→分析问题（明确问题性质与关键）→提出假设（提出解决方案）→验证假设（通过实践或推检验证）。"},
{ch:"第六章 思维与问题解决",q:"数学老师发现学生总用上周学过的“数列求和公式”去套今天的新题，结果绕了远路。这反映了（　）对问题解决的影响。",o:["功能固着","定势","负迁移","动机过强"],a:1,e:"定势是先前活动形成的心理准备状态，使人以固定方式解决问题；对同类问题有积极作用，对变化了的新问题有消极作用。"},
{ch:"第六章 思维与问题解决",q:"关于情绪状态对问题解决的影响，正确的说法是（　）。",o:["越紧张越有利于解决问题","情绪对问题解决没有影响","适度的平静与紧张有利于解决问题，过度焦虑会阻碍问题解决","只要动机强，情绪无关紧要"],a:2,e:"过度紧张焦虑会缩小注意范围、干扰思维；适度平静（中等唤醒）下认知活动效率最高，与耶克斯—多德森定律的精神一致。"},
{ch:"第七章 创造性",q:"在“砖头用途”测验中，被试给出的答案跨越了工具类、建材类、艺术类等多个不同类别。这体现的创造性特征是（　）。",o:["流畅性","变通性","独特性","精致性"],a:1,e:"变通性指思维能随机应变、触类旁通，答案类别（角度）的多少反映变通性；数量反映流畅性，新颖罕见反映独特性。"},
{ch:"第七章 创造性",q:"研究表明，对创造性发挥最有利的动机类型是（　）。",o:["外部物质奖励动机","为分数和排名而学的动机","由兴趣和求知欲驱动的内部动机","逃避惩罚的动机"],a:2,e:"内部动机（兴趣、求知欲、自我实现）更有利于创造性；过度的外部奖惩会削弱内在兴趣，把注意力引向外部目标。"},
{ch:"第八章 品德",q:"科尔伯格道德发展阶段中，“以社会契约和法律为定向”（认为规则可以通过民主程序修改）处于（　）。",o:["前习俗水平","习俗水平","后习俗水平","超习俗水平"],a:2,e:"后习俗水平包括社会契约定向和普遍伦理原则定向两阶段，个体以社会契约、普世伦理等内在标准作道德判断，超越了对权威和秩序的单纯服从。"},
{ch:"第八章 品德",q:"德育既要提高学生的道德认识，又要组织道德行为实践，做到言行一致。这体现的德育原则是（　）。",o:["疏导原则","知行统一原则","尊重与严格要求相结合原则","因材施教原则"],a:1,e:"知行统一原则要求把提高道德认识与组织行为练习结合起来，防止“知而不行”；疏导重在循循善诱说理，因材施教重在区别对待。"},
{ch:"第十一章 动机",q:"根据耶克斯—多德森定律，完成中等难度的学习任务时，效率最高的动机水平是（　）。",o:["偏低","中等","偏高","极高"],a:1,e:"动机与效率呈倒U型：一般而言中等强度动机效率最高；最佳点随任务难度偏移——任务越难最佳动机越低，越易则可偏高。"},
{ch:"第十一章 动机",q:"马斯洛需要层次由低到高的正确排列是（　）。",o:["生理→安全→归属与爱→尊重→自我实现","安全→生理→尊重→归属与爱→自我实现","生理→归属与爱→安全→尊重→自我实现","生理→安全→尊重→归属与爱→自我实现"],a:0,e:"由低到高依次为生理、安全、归属与爱、尊重、自我实现（教材另有求知、审美等层次），低层需要基本满足后高层需要才占优势。"},
{ch:"第十一章 动机",q:"下列选项中，属于自我效能感最主要来源的是（　）。",o:["他人的口头鼓励","亲历的成败经验（掌握性经验）","书本知识的学习","运气的好坏"],a:1,e:"班杜拉认为自我效能感主要来源于：亲历的成败经验（最重要）、替代性经验（榜样）、言语说服、情绪生理状态。"},
{ch:"第十一章 动机",q:"韦纳归因理论中，把成功归因于“运气”，属于（　）。",o:["内部、稳定、不可控","外部、不稳定、不可控","内部、不稳定、可控","外部、稳定、可控"],a:1,e:"运气是外部、不稳定、不可控因素；归因于运气者难以形成稳定的成功期望，不利于学习动机的持续。"},
{ch:"第十一章 动机",q:"某学生多次考试失败后认定“我再怎么努力也没用”，从此放弃努力。这种“习得性无助”主要源于把失败归因于（　）。",o:["努力不足","方法不当","能力低下","运气不好"],a:2,e:"把失败归因于能力（内部、稳定、不可控）最易导致期望丧失与习得性无助；归因于努力、方法等可控因素则能维持期望、激发行动。"},
{ch:"第十二章 教学心理",q:"课堂上学生公开顶撞教师、故意捣乱，教学活动难以正常进行。这种课堂心理气氛属于（　）。",o:["积极型","消极型","对抗紧张型","中立型"],a:2,e:"对抗紧张型表现为师生关系紧张、学生失控对抗、课堂纪律严重混乱；消极型是学生消极被动、心不在焉但不正面对抗。"},
{ch:"第十二章 教学心理",q:"下列不属于高校课堂管理核心目标的是（　）。",o:["保障学生学习顺利进行","培养学生自律能力","优化课堂心理气氛","片面追求考试升学率"],a:3,e:"课堂管理的核心是保障学习、培养自律、优化课堂心理气氛；纪律与分数只是手段，把手段当目的会使课堂失去教育性。"},
{ch:"第十二章 教学心理",q:"《论语》中“不愤不启，不悱不发”体现的高校高效教学模式是（　）。",o:["灌输式教学","启发式教学","放任式教学","复述式教学"],a:1,e:"孔子强调在学生“心求通而未得、口欲言而不能”时予以启发，正是启发式教学的思想源头，与探究式、合作式同属高效教学模式。"}
];

var JUDGE=[
{ch:"第一章 概论",q:"高等教育心理学的研究对象是高等教育情境中学生的学与教师的教的基本心理规律。",a:true,e:"正确。研究对象是高校「教与学」双方的心理规律，涵盖学的心理、教的心理及交往互动中的心理。"},
{ch:"第一章 概论",q:"教育性原则要求研究应有利于被试的身心发展，不能因研究损害被试的利益。",a:true,e:"正确。教育性（发展性）原则要求把教育与研究统一，研究过程和结果都不应损害大学生、教师的身心健康与利益。"},
{ch:"第二章 教师心理",q:"教师威信一旦建立便可一劳永逸，无需再刻意维护。",a:false,e:"错误。威信形成后需要维护与发展：做到言行一致、不断完善专业能力、尊重学生、勇于自我批评，否则会逐渐降低甚至丧失。"},
{ch:"第二章 教师心理",q:"研究表明，专家型教师的职业倦怠水平通常显著低于新手型和熟手型教师。",a:true,e:"正确。专家型教师教学效能感高、职业情感投入深、从工作中获得的成就感强，职业倦怠（尤其情绪耗竭）显著更低。"},
{ch:"第四章 学习理论",q:"负强化就是惩罚，两者都会使行为发生的频率降低。",a:false,e:"错误。负强化是撤销厌恶刺激，使行为频率增加；惩罚是呈现厌恶刺激或撤销愉快刺激，使行为频率降低。两者方向相反，不能混同。"},
{ch:"第四章 学习理论",q:"消退是指曾被强化的反应之后不再给予强化，从而使该反应频率逐渐下降的现象。",a:true,e:"正确。如学生课堂上做怪相以引人发笑，若师生 consistently 不予理睬（撤除关注这一强化物），怪相行为会逐渐消失。"},
{ch:"第三章 心理特点",q:"大学生一般处于皮亚杰认知发展的形式运算阶段。",a:true,e:"正确。形式运算阶段（11、12岁以后）以抽象逻辑思维为主，大学生抽象逻辑思维已趋成熟并占主导。"},
{ch:"第三章 心理特点",q:"最近发展区就是个体当前已经达到的发展水平。",a:false,e:"错误。最近发展区是现有水平与潜在发展水平（在帮助下可达到的水平）之间的差距，“现有水平”只是它的下限。"},
{ch:"第三章 心理特点",q:"皮亚杰“三山实验”表明，前运算阶段儿童的思维具有自我中心性。",a:true,e:"正确。前运算阶段（2-7岁）儿童难以站在他人视角看问题，三山实验是自我中心性的经典证据。"},
{ch:"第十一章 动机",q:"根据耶克斯—多德森定律，动机水平越强，学习效率就越高。",a:false,e:"错误。动机与效率呈倒U型关系：动机过弱缺乏动力，动机过强引起紧张焦虑，只有适中的动机效率最高，且最佳点随任务难度变化。"},
{ch:"第十一章 动机",q:"马斯洛认为，只有低层次需要得到百分之百满足后，高层次需要才会出现。",a:false,e:"错误。需要由低到高逐级出现，但并非绝对——低层需要基本满足即可产生高层需要，各层次还可相互重叠，不同个体占优势的需要也不同。"},
{ch:"第十一章 动机",q:"自我效能感高的个体更倾向于选择有挑战性的任务，并能坚持更长时间。",a:true,e:"正确。自我效能感影响行为选择、努力与坚持性、思维模式和情绪反应，是重要的学习动机变量。"},
{ch:"第十一章 动机",q:"韦纳归因理论中，“努力”属于内部、稳定、不可控的因素。",a:false,e:"错误。努力是内部、不稳定、可控的因素——正因其可控，引导学生把成败归因于努力最有利于激发后续动机。"},
{ch:"第八章 品德",q:"道德认知是品德形成的基础，道德行为是衡量个体品德水平的重要标志。",a:true,e:"正确。知、情、意、行四要素中，道德认知是基础和核心，道德行为是品德形成的最终目的和衡量标志，德育要促进学生知行统一。"},
{ch:"第七章 创造性",q:"创造性与智力成正比，高智力者必有高创造性。",a:false,e:"错误。高智力是高创造性的必要条件而非充分条件；智力与创造性呈非线性关系，高创造性者智商一般在中上，但高智商者不一定有高创造性。"},
{ch:"第四章 学习理论",q:"大学生学习的突出特点是专业性、自主性、探究性、创造性和实践性。",a:true,e:"正确。大学生的学习围绕专业方向展开，强调自主安排、探究发现、勇于创新并注重理论联系实际。"},
{ch:"第八章 品德",q:"疏导原则是指对学生的思想问题要以防、堵为主，禁止其接触不良信息。",a:false,e:"错误。疏导原则要求循循善诱、以理服人，从提高道德认识入手、因势利导地引导学生，而不是简单堵塞禁止。"},
{ch:"第十二章 教学心理",q:"课堂管理就是维持课堂纪律，只要纪律好就说明课堂管理好。",a:false,e:"错误。课堂管理的核心目标：保障学生学习顺利进行、培养学生自律能力、优化课堂心理气氛，纪律只是手段之一而非全部。"},
{ch:"第二章 教师心理",q:"角色超载是指个体同时面对多种相互冲突的角色期望。",a:false,e:"错误。多种期望相互冲突是“角色冲突”；角色超载指角色期望过多、超出个人时间与能力的承受范围。"},
{ch:"第二章 教师心理",q:"教师威信一旦丧失就再也不可能重建。",a:false,e:"错误。威信可以重建与再建：通过提高教育教学能力、改善人格品质、真诚对待学生、不断自我完善，仍可重新赢得学生信服；当然重建比维护更难。"},
{ch:"第一章 概论",q:"观察法必须在实验室控制的情境下进行。",a:false,e:"错误。观察法的基本特点正是在自然的教育情境中进行有目的、有计划的观察记录；在控制情境中主动引起心理现象的是实验法。"},
{ch:"第三章 心理特点",q:"心理发展的差异性要求教育必须因材施教。",a:true,e:"正确。个体之间在能力、性格、思维风格等方面存在差异，教育要针对个别差异因材施教。"},
{ch:"第三章 心理特点",q:"大学生的抽象逻辑思维已趋成熟，因此不需要再进行思维训练。",a:false,e:"错误。大学生思维仍需培养：提高逻辑性、批判性和创造性，加强独立思考、大胆质疑的训练。"},
{ch:"第四章 学习理论",q:"“先行组织者”是奥苏贝尔提出的、在学习任务之前呈现的引导性材料。",a:true,e:"正确。先行组织者为新的学习提供上位固着点，促进新旧知识的联系，实现有意义接受学习。"},
{ch:"第四章 学习理论",q:"替代强化是指观察者因看到榜样受强化而受到的强化。",a:true,e:"正确。班杜拉区分直接强化、替代强化与自我强化，替代强化是观察学习的重要动机机制。"},
{ch:"第十一章 动机",q:"马斯洛需要层次中的尊重需要属于成长性需要。",a:false,e:"错误。生理、安全、归属与爱、尊重属缺失性需要；求知、审美、自我实现属成长性需要。"},
{ch:"第八章 品德",q:"科尔伯格道德发展阶段理论中，“服从与惩罚定向”属于前习俗水平。",a:true,e:"正确。前习俗水平包括服从与惩罚定向、工具性的相对主义（利己）定向两阶段；习俗水平包括好孩子定向与维护社会秩序定向。"},
{ch:"第八章 品德",q:"学生的品德一旦形成就不会再改变。",a:false,e:"错误。品德发展具有可塑性和反复性，环境和教育的变化会引起品德的变化，德育要长期坚持、正确对待反复。"},
{ch:"第十二章 教学心理",q:"教师的课堂领导方式是影响课堂心理气氛的重要因素。",a:true,e:"正确。民主型领导易形成积极型课堂气氛，专制型易致消极或对抗紧张气氛；此外课程内容、学生状态等也有影响。"},
{ch:"第一章 概论",q:"理论联系实际原则要求高等教育心理学的研究选题和成果应服务于高等教育实践，并接受教育实践的检验。",a:true,e:"正确。理论联系实际原则反对脱离实际的纯思辨研究，强调研究源于实践、服务实践、接受实践检验。"},
{ch:"第二章 教师心理",q:"教师威信主要取决于教师的权威地位和严厉程度。",a:false,e:"错误。威信取决于教师的人格品质、专业素养、教学能力以及真诚平等的师生关系；靠权威压服只能换来表面的“威严”，不能使学生真正信服。"},
{ch:"第三章 心理特点",q:"埃里克森认为，6-12岁儿童的主要发展任务是获得勤奋感、避免自卑感。",a:true,e:"正确。该阶段（小学期）儿童在与同伴的共同学习和竞争中发展勤奋感，频繁失败与负面评价则导致自卑。"},
{ch:"第三章 心理特点",q:"自我意识由自我认知、自我体验和自我调控三种心理成分构成。",a:true,e:"正确。自我认知是基础（如自我观察、自我评价），自我体验是情感成分（如自尊、自信），自我调控是意志成分（如自我监督、自我激励）。"},
{ch:"第四章 学习理论",q:"消退也是一种惩罚，因为两者都会使行为频率下降。",a:false,e:"错误。消退是撤除强化物使行为减弱（不予理睬）；惩罚是呈现厌恶刺激或撤销愉快刺激。两者机制不同，消退不呈现任何厌恶刺激。"},
{ch:"第四章 学习理论",q:"接受学习必然是机械学习，发现学习必然是有意义学习。",a:false,e:"错误。奥苏贝尔指出接受—发现与机械—有意义是两个独立维度：接受学习可以是有意义的（理解地听讲），发现学习也可能是机械的（机械地尝试）。"},
{ch:"第四章 学习理论",q:"建构主义认为知识是客观确定的，学习就是把这些知识原样装进头脑。",a:false,e:"错误。建构主义认为知识不是对现实的绝对准确表征，学习是学习者基于原有经验在情境中主动建构意义的过程。"},
{ch:"第五章 知识获得",q:"先学会骑自行车有利于学习骑摩托车，这是一种负迁移。",a:false,e:"错误。先前学习促进后续学习是正迁移；负迁移是阻碍作用，如方言口音干扰普通话发音。"},
{ch:"第六章 思维与问题解决",q:"定势对问题解决只有消极作用。",a:false,e:"错误。定势在情境不变时有助于快速解决同类问题（积极作用）；只有当情境变化、仍套用旧法时才起消极作用。"},
{ch:"第六章 思维与问题解决",q:"过度的焦虑和紧张会阻碍问题的解决。",a:true,e:"正确。过度紧张使注意范围缩小、思维僵化，阻碍问题解决；适度的平静与紧张（中等唤醒）最有利于认知活动。"},
{ch:"第七章 创造性",q:"低创造性者的智商水平可能高，也可能低。",a:true,e:"正确。高智力是高创造性的必要而非充分条件；智商高者创造性可高可低，低创造性者智商也可高可低，两者呈非线性关系。"},
{ch:"第八章 品德",q:"道德情感是品德行为的动力，道德意志是调节道德行为的精神力量。",a:true,e:"正确。品德结构中，道德认知是基础和核心，道德情感起动力（催化）作用，道德意志克服困难、调节行为，道德行为是标志。"},
{ch:"第十一章 动机",q:"把失败归因于能力不足，最容易导致习得性无助。",a:true,e:"正确。能力是内部、稳定、不可控因素，如此归因使学生对未来成败丧失期望，产生“努力无用”的习得性无助，放弃努力。"}
];

var ESSAY=[
{ch:"第四章 学习理论",q:"【举例说明】正强化、负强化、惩罚与消退的区别。",
pts:["正强化：呈现愉快刺激，使行为频率增加；","负强化：撤销厌恶刺激，使行为频率增加；","惩罚：呈现厌恶刺激或撤销愉快刺激，使行为频率降低；","消退：曾经被强化的反应不再得到强化，行为频率下降。"],
demo:"示例：学生积极发言，教师当众表扬（正强化）；学生按时交作业即取消其值日任务（负强化）；学生旷课被通报批评（惩罚）；学生课堂做怪相引人发笑，师生一致不予理睬，怪相逐渐消失（消退）。"},
{ch:"第三章 心理特点",q:"【举例说明】维果茨基的“最近发展区”及其对大学教学的启示。",
pts:["定义：现有发展水平与在成人（教师）帮助下可达到的潜在发展水平之间的差距；","教学应走在发展的前面，立足于最近发展区；","启示：提供适度挑战性任务；给予“支架”式帮助并逐步撤除；因材施教。"],
demo:"示例：大一学生目前只能独立完成文献综述提纲（现有水平），在导师提供范例、分步指导下能完成规范的小论文（潜在水平），二者差距即最近发展区。随着学生能力提高，导师指导逐步减少，最终学生独立完成——这就是支架式教学的运用。"},
{ch:"第十一章 动机",q:"【举例说明】耶克斯—多德森定律。",
pts:["动机强度与工作效率呈倒U型曲线关系；","中等强度动机时效率最高；","最佳动机水平随任务难度变化：任务越难，最佳动机水平越低；任务越容易，最佳动机水平可偏高。"],
demo:"示例：英语单词听写属较容易任务，动机强一些效率更高；撰写学位论文、参加数学建模竞赛属困难任务，需保持平和、适度紧张的动机状态效率最佳。考前过度焦虑（动机过强）会“大脑一片空白”，毫无动力（动机过弱）也考不好。"},
{ch:"第五章 知识获得",q:"【举例说明】陈述性知识与程序性知识的区别与联系。",
pts:["陈述性知识回答“是什么”“为什么”，可以言传；程序性知识回答“怎么做”，通过操作表现；","程序性知识往往以陈述性知识为基础，经练习内化、自动化；","两者在学习中相互转化、相互支持。"],
demo:"示例：能说出“光的折射定律”的内容属陈述性知识；能动手调整鱼叉角度准确叉到水中的鱼属程序性知识。学生先学习操作规程（陈述性），反复练习后闭着眼睛也能熟练完成（程序性），说明陈述性知识经变式练习可转化为程序性知识。"},
{ch:"第六章 思维与问题解决",q:"【举例说明】定势与功能固着对问题解决的影响。",
pts:["定势：先前活动形成的心理准备状态，使人以固定方式解决问题；对同类问题有积极作用，对变化了的新问题有消极作用；","功能固着：只看到物体的惯常功能，阻碍发现新用途，是定势的特殊表现；","克服方法：变式训练、发散思维训练、换个角度定义问题。"],
demo:"示例：长期用“设未知数列方程”的套路解题，遇到可用算术巧解的题仍硬套方程而绕远路（定势）；邓克尔“蜡烛问题”中被试想不到把图钉盒钉在墙上当烛台（功能固着）。"},
{ch:"第四章 学习理论",q:"【举例说明】奥苏贝尔有意义接受学习及其条件。",
pts:["实质：新知识与认知结构中原有适当观念建立非人为的、实质性的联系；","客观条件：学习材料本身具有逻辑意义；","主观条件：①学习者认知结构中有可利用的适当观念（固定点）；②学习者有有意义学习的心向，主动联系、力求理解。"],
demo:"示例：学生先掌握“函数”概念，再学习“导数”时主动将其理解为“函数的变化率”，与已有观念建立合乎逻辑的联系——这是有意义接受学习；反之，不理解内涵而死背导数公式，即便听讲也是机械学习。"},
{ch:"第四章 学习理论",q:"【举例说明】班杜拉观察学习的过程。",
pts:["观察学习经四个过程完成：注意过程→保持过程→动作再现过程→动机过程；","强化（直接强化、替代强化、自我强化）主要影响行为的动机与表现。"],
demo:"示例：师范生观摩名师课堂，注意到其提问追问技巧（注意），用笔记和录像记住操作要点（保持），在微格教学中模仿演练（动作再现），获指导教师好评后更愿意在真实课堂中运用（动机）。"},
{ch:"第十一章 动机",q:"【举例说明】韦纳归因理论，并说明如何对学业失败的学生进行积极归因训练。",
pts:["三维度：原因源（内部/外部）、稳定性（稳定/不稳定）、可控性（可控/不可控）；","常见归因：能力（内、稳、不可控）、努力（内、不稳、可控）、任务难度（外、稳、不可控）、运气（外、不稳、不可控）；","把失败归因于能力易导致习得性无助；引导归因于努力、方法等可控因素，可保持成功期望、提高动机。"],
demo:"示例：挂科学生说“我天生学不好数学”，教师引导其分析“本学期投入不足、刷题方法不当”（可控原因），共同制定小步子计划；下次测验进步后及时肯定其努力，逐渐形成“努力+方法”的积极归因风格。"},
{ch:"第十一章 动机",q:"【举例说明】马斯洛需要层次理论在高校学生教育管理中的应用。",
pts:["需要由低到高：生理→安全→归属与爱→尊重→自我实现；","缺失性需要（前四种）得到基本满足是个体成长的前提；先满足基本需要，再激发高层次需要；","应用：解决学生现实困难、营造归属感，再通过学业与科研平台促其自我实现。"],
demo:"示例：贫困生因生活费无着（生理需要）无法安心学习，学校先提供助学金和勤工助学岗位；新生宿舍矛盾使其缺乏归属感，辅导员组织宿舍团建；在此基础上鼓励其参加学科竞赛、进课题组，满足自我实现的需要。"},
{ch:"第七章 创造性",q:"【举例说明】创造性的流畅性、变通性与独特性。",
pts:["流畅性：单位时间内产生有效观念的数量；","变通性：观念类别的广度，能突破思维定势、多角度思考；","独特性：观念新颖独到、与众不同。"],
demo:"示例：“回形针用途”测验中，30秒内说出15种用途体现流畅性；用途跨越文具、工具、装饰、艺术等不同类别体现变通性；提出“可作DNA双螺旋模型支架”这样罕见独到的想法体现独特性。"},
{ch:"第二章 教师心理",q:"【举例说明】角色冲突与角色超载的区别，以及教师的调适方法。",
pts:["角色冲突：多种角色期望相互矛盾、难以兼顾；","角色超载：角色期望过多，超出个人时间与能力的承受范围；","调适：角色排序与时间管理、提高角色技能、争取组织支持（合理工作量、明确职责）、寻求家庭与社会理解、必要时心理调适。"],
demo:"示例：一位青年教师既是教师（要备课、答疑）又是班主任（要跟班、处理事务）又是科研人员（要报课题、发论文）还是父亲（孩子生病需陪护）——四种期望同时压来属角色超载；其中“学校要求坐班”与“学生希望课后随时答疑”、“家人要求陪伴”与“科研要求加班”相互矛盾属角色冲突。调适：与学院协商减免行政事务、固定答疑时间、善用碎片时间科研。"},
{ch:"第四章 学习理论",q:"【举例说明】替代强化与自我强化。",
pts:["替代强化：观察者看到榜样行为受强化，自己也增强做出该行为的倾向；","自我强化：个体依据自己设定的标准评价行为，达到标准便自我奖励；","两者都源自班杜拉的社会认知理论，与直接强化共同构成三种强化来源。"],
demo:"示例：学生看到同宿舍同学坚持晨读获国家奖学金（榜样受强化），自己也开始晨读——替代强化；该生为自己定下“每天背50个单词，完成就打一局球”的约定并执行——自我强化。"},
{ch:"第十一章 动机",q:"【举例说明】马斯洛缺失性需要与成长性需要的区别及其教育意义。",
pts:["缺失性需要（生理、安全、归属与爱、尊重）：由缺乏引起，满足后强度降低；","成长性需要（求知、审美、自我实现）：满足后进一步增强，是发展的动力；","教育意义：先帮助学生满足基本需要，再有效激发成长性需要，遵循由低到高的顺序但不绝对化。"],
demo:"示例：新生因宿舍矛盾缺乏归属感（缺失性需要）而情绪低落、无心学习，辅导员先调解矛盾、组织团建满足归属需要；此后鼓励其参加学科竞赛、进课题组，激发求知与自我实现需要（成长性需要）——学习动力随之从“要我学”转为“我要学”。"},
{ch:"第三章 心理特点",q:"【举例说明】大学生理想自我与现实自我的矛盾及自我同一性的建立。",
pts:["理想自我：个体希望自己成为的样子；现实自我：实际达到的状态；","大学生自我意识独立、敏感、矛盾，理想我与现实我差距过大时产生自我怀疑、焦虑；","建立自我同一：正确认识自我（全面、发展的眼光）、调整理想自我使其恰当、通过实践缩小差距、悦纳自我。"],
demo:"示例：某学生理想是“成为知名记者”，现实是“专业排名靠后、实习无着落”，差距使其自卑焦虑。辅导员引导其把大目标分解为“本学期发3篇校园报道、暑假进媒体实习”的小目标，在实践中能力提升、逐步逼近理想自我，实现理想我与现实我的统一。"},
{ch:"第四章 学习理论",q:"【举例说明】建构主义学习环境四要素（情境、协作、会话、意义建构）在课堂教学中的体现。",
pts:["情境：学习应在与真实情境相类似的环境中发生；","协作：贯穿学习全过程的师生、生生协商合作；","会话（交流讨论）：小组成员通过交流讨论推进意义建构；","意义建构：学习的最终目标——对事物性质、规律及联系的深刻理解。"],
demo:"示例：广告学课“校园垃圾分类传播方案”项目：教师引入社区真实垃圾分类任务（情境）；学生分组调研、分工协作（协作）；组内讨论方案、课堂答辩交流（会话）；最终形成对“传播效果影响因素”的深度理解并迁移到新方案（意义建构）。"},
{ch:"第四章 学习理论",q:"【举例说明】罗杰斯促进学习的三个心理气氛条件。",
pts:["真诚一致：教师表里如一、真实面对学生，不戴假面具；","同理心（共情）：设身处地理解学生的内心感受；","无条件积极关注：不因成绩、表现而否定学生，尊重其价值。"],
demo:"示例：学生论文抄袭被发现，教师没有当众训斥，而是先说“我理解你想按时交稿的压力”（共情），坦承自己读书时也曾为deadline焦虑（真诚），同时明确“我相信你能独立写好，我们一起改”（无条件积极关注）——学生随后主动重写并从此按时交稿。"},
{ch:"第五章 知识获得",q:"【举例说明】正迁移与负迁移。",
pts:["正迁移：一种学习对另一种学习起促进作用；","负迁移：一种学习对另一种学习起阻碍（干扰）作用；","教学中应促进正迁移、防止负迁移。"],
demo:"示例：学会英语语法后学第二外语德语更快（正迁移）；而先入为主的英语发音习惯干扰了德语小舌音的学习（负迁移）。再如先学打羽毛球再学网球，握拍习惯互相干扰（负迁移），而脚步移动经验则互相助益（正迁移）。"},
{ch:"第六章 思维与问题解决",q:"【举例说明】动机与情绪对问题解决的影响。",
pts:["动机：动机过弱缺乏解决问题的主动性；动机过强引起高度紧张、思维僵化；中等强度动机最有利（耶克斯—多德森定律）；","情绪：积极平稳的情绪提高思维灵活性；过度焦虑、抑郁使注意狭窄、思路阻塞。"],
demo:"示例：解数学压轴题时，完全不在乎的学生早早放弃（动机过弱）；“必须满分”的学生手抖脑空、连会做的步骤也乱（动机过强+过度焦虑）；而“尽力按步骤来”的学生心态平稳，最可能解出（中等动机）。"},
{ch:"第八章 品德",q:"【举例说明】品德结构“知情意行”的统一培养（以诚信教育为例）。",
pts:["道德认知：讲清诚信的意义和不诚信的后果（知）；","道德情感：通过诚信榜样故事唤起敬佩、对失信行为产生羞耻感（情）；","道德意志：在利益诱惑面前坚定守诺（意）；","道德行为：布置诚信考场、按时履约等行为训练（行）；四者统一，德育才能见效。"],
demo:"示例：针对考试作弊，教师先组织讨论“作弊对公平的伤害”（知），观看守榜考生诚信应考报道引发共鸣（情），设立“无人监考诚信考场”让学生在诱惑中锻炼意志（意），并建立个人诚信档案记录履约行为（行）——知情意行协同培养。"},
{ch:"第十一章 动机",q:"【举例说明】自我效能感的来源及其培养途径。",
pts:["来源：①亲历的成败经验（最重要）；②替代性经验（榜样）；③言语说服；④情绪生理状态。","培养：创造成功体验、设置恰当目标；提供相似榜样；给予具体可信的鼓励；教学生调节紧张情绪。"],
demo:"示例：“我怕水学不会游泳”的学生：先在浅水区完成漂浮成功（成败经验）；看同班零基础同学学会的视频（替代经验）；教练指出“你上周换气已经比刚来时好很多”（言语说服）；练习前做放松训练缓解心慌（情绪调节）——多途径共同提升其“我能学会”的自我效能感。"}
];

var CASES=[
{ch:"第二章 教师心理",t:"“疲惫的李老师”——教师职业倦怠",
bg:"李老师在某高校任教第9年，常年重复讲授同一门公共课。近期评职称失利后，他常感精力耗尽，一想到上课就疲惫；对学生日益冷淡，作业草草批改，学生提问也懒得细答，私下说“学生怎么样与我无关”；他还觉得“教书没什么意思，这辈子不会有太大成就”，甚至萌生离职念头。",
q:"问题：(1) 李老师的表现符合教师职业倦怠的哪些维度？请结合材料分析。(2) 分析其职业倦怠的可能原因。(3) 提出调适的建议。",
pts:["①情绪耗竭：精力耗尽、一想到上课就疲惫，是倦怠的核心维度；","②去个性化：对学生冷淡敷衍，“学生与我无关”，以消极麻木态度对待工作对象；","③低个人成就感：认为教书没意思、不会有成就，自我评价和成就体验降低。","原因分析：职业因素（多年重复劳动、挑战性不足）；组织因素（评职称失利、晋升受挫、缺乏组织支持）；个人因素（应对方式单一、期望与现实落差）。","建议：认知调整，合理设定期望，正确看待挫折；主动获取社会支持（同事交流、教学共同体、家庭）；丰富教学科研生活，进行教学创新、参与科研项目，向专家型教师发展；学校层面应完善评价激励机制、提供发展平台；必要时寻求专业心理辅导。"]},
{ch:"第十一章 动机",t:"“考前焦虑的小陈”——耶克斯—多德森定律",
bg:"大三学生小陈的父母要求她“必须考上名校研究生”，她给自己定下“每门功课必须90分以上”的目标。每次考试前她都失眠、心慌、手抖，平时会做的题目一到考场就“大脑一片空白”，成绩不升反降，越考越怕，形成恶性循环。",
q:"问题：请运用动机理论分析小陈考试失常的原因，并提出辅导建议。",
pts:["①耶克斯—多德森定律：动机强度与工作效率呈倒U型关系，中等动机效率最高；动机过强引起高度焦虑，注意和认知资源被担忧占用，反而妨碍回忆和思维。","②学习与考试属复杂任务，其最佳动机水平本应偏低；小陈“必须90分以上”“必须考上”的绝对化目标使动机过强、焦虑过度，导致平时会做的题考场做不出。","辅导建议：帮助其把“必须考到多少分”的结果性目标调整为“掌握知识、正常发挥”的过程性目标；进行放松训练（深呼吸、渐进式肌肉放松）和系统脱敏缓解考试焦虑；引导正确认识考试意义，一次考试不等于人生；与家长沟通，降低外部压力源；创造成功体验，提升自我效能感。"]},
{ch:"第十一章 动机",t:"“破罐破摔的小刘”——归因与习得性无助",
bg:"小刘高等数学连续两次挂科。他说：“我高中数学就差，天生不是学数学的料，再努力也没用。”从此他不再上自习，作业靠抄同学，还觉得“认真努力却还挂科才丢人”。辅导员找他谈心，他直言“练了也没希望”。",
q:"问题：请用韦纳归因理论分析小刘的归因模式及其后果，并为他设计一份归因训练方案。",
pts:["①归因分析：“天生不是学数学的料”是把失败归因于能力——内部、稳定、不可控的因素。","②后果：稳定归因使他对未来成败的期望丧失（“再努力也没用”），产生习得性无助，进而在行为上放弃努力（不上自习、抄作业）；可控感缺失还使其用“不努力”来保护自尊（怕“努力了还失败丢人”）。","③归因训练方案：a.接纳情绪，建立信任；b.与其共同分析试卷和作业，找出真实可控原因（练习量不足、方法不当）；c.引导其将失败归因于努力与方法等内部、可控因素；d.制定小步子、可达成的小目标（如每天两道题、先攻一章）；e.取得点滴进步及时肯定强化，积累成功体验；f.持续巩固，形成“努力+方法”的积极归因风格，同时提升自我效能感。"]},
{ch:"第十二章 教学心理",t:"“满堂灌的王老师”——有效教学与学习理论",
bg:"王老师备课非常认真，每节课的PPT多达两百页。他从头讲到尾赶进度，几乎不提问、不讨论，他认为“我讲得越全，学生学得越多”。但学生反映跟不上、听一会儿就走神，期中测验平均分年级最低，课堂沉闷，无人提问，王老师很委屈。",
q:"问题：(1) 请运用有效教学的特征和相关学习理论分析王老师教学中存在的问题。(2) 提出改进建议。",
pts:["①有效教学特征角度：目标明确不等于容量越大越好；王老师方法单一、互动严重不足，未能激发学生参与；“内容科学”也要以学生可接受、能内化为前提。","②学习理论角度：奥苏贝尔指出接受学习不等于机械学习，讲授必须与学生原有知识建立实质性联系、激发有意义学习的心向，否则沦为机械灌输；建构主义认为学习是学生主动的意义建构，需要情境、协作、会话的支撑，单向讲授剥夺了学生的建构过程；人本主义强调学生的情感与参与。","③改进建议：精讲学科基本结构（基本概念原理），突出重点难点（布鲁纳）；采用启发式提问、案例讨论、小组合作学习，增加师生与生生互动；采用任务驱动、探究式教学，让学生在做中学；加强形成性评价与及时反馈；关注学生反馈，动态调整教学进度与方法。"]},
{ch:"第八章 品德",t:"“抄袭风波”——品德结构与德育原则",
bg:"大二学生小周为争取奖学金抄袭他人论文并获了奖，后被查实。辅导员当众严厉训斥，宣布其“品德败坏”，取消评奖资格，小周情绪低落并产生对立情绪。班主任李老师随后单独与他谈心，既严肃指出抄袭违反学术诚信，又肯定他想上进的初衷，要求他公开说明情况并独立重写论文。此后小周诚实守信、学习踏实，再未出现学术不端。",
q:"问题：(1) 结合品德心理结构（知、情、意、行）分析对小周的教育过程。(2) 分析两位老师的处理分别体现或违背了哪些德育原则。",
pts:["①品德结构分析：道德认知——通过谈心使小周认识抄袭违反学术诚信（认知是基础）；道德情感——严肃批评唤起羞愧感，同时保护其上进心（情感是动力）；道德意志与道德行为——要求其公开说明、独立重写论文并坚持诚信行为（行为是衡量标志），实现了知行统一。","②辅导员违背了：疏导原则（未循循善诱、以理服人，而是当众训斥）；尊重学生与严格要求相结合原则（给学生贴“品德败坏”标签，伤害自尊）。","③李老师体现了：疏导原则（摆事实讲道理、以理服人）；尊重与严格要求相结合（肯定上进心，同时坚决要求改正）；知行统一原则（在重写论文、公开说明的行动中养成诚信行为）；因材施教（针对小周上进但走捷径的特点个别引导）。"]},
{ch:"第二章 教师心理",t:"“从站稳讲台到读懂学生”——教师专业成长",
bg:"张老师入职第一年，最关心“学生喜不喜欢我”“领导同事怎么评价我”，备课以自我展示为中心。第四年，他关注的是“这节课内容讲完没有”“进度赶不赶得上”“考试成绩如何”。第八年，他开始依据学生基础差异分层设计任务，课堂提问兼顾不同水平的学生，并坚持撰写教学反思，最终成长为省级教学名师。",
q:"问题：请运用教师专业成长阶段理论分析张老师的发展历程，并说明如何促进新教师的专业成长。",
pts:["①福勒和布朗三阶段理论：第一年处于关注生存阶段——关注人际关系、被接纳与生存适应；第四年处于关注情境阶段——关注教学任务完成、进度与成绩；第八年进入关注学生阶段——关注学生个体差异、因材施教。能否自觉关注学生是衡量教师是否成熟的重要标志。","②张老师的路径体现了从新手型教师经熟手型向专家型教师的发展，教学反思在其成长中发挥了关键作用（波斯纳：经验＋反思＝成长）。","③促进新教师成长：加强教学反思（写反思日记、课例研究）；观摩优秀教师课堂、师徒结对；开展行动研究，把问题变课题；参与教师学习共同体；在实践中锻炼，积累实践性知识；学校提供入职辅导与发展性评价。"]},
{ch:"第七章 创造性",t:"“标准答案”——创造性培养",
bg:"钱老师的课堂上，有学生提出“教科书上的这个结论有没有可能被推翻”，钱老师回答：“别想这些歪门邪道，考试就按标准答案答。”此后，课堂上主动提问的学生越来越少，作业答案千篇一律，班里的“点子大王”也变得沉默了。",
q:"问题：请运用创造性培养的相关理论分析钱老师做法的不当之处，并提出改进建议。",
pts:["①不当之处：环境因素是影响创造性的重要变量，心理安全与心理自由是创造发挥的前提；钱老师否定质疑、唯一“标准答案”，营造了紧张压抑的课堂气氛，压抑了学生的好奇心、求知欲和发散思维，扼杀了创造性。","②改进建议：营造宽松、民主、支持性的课堂氛围，允许出错，延迟评判；实行启发式教学，保护鼓励学生的质疑与求异思维（“学起于思，思源于疑”）；进行发散思维训练（如一题多解、头脑风暴），克服定势与功能固着；改革评价方式，鼓励独特性和新颖性的答案；引导学生参与科研实践，在真实问题中激发创造动机；教师自身树立创造型学生的正确观念——创造性强者往往“淘气”“好奇”，不应视为捣乱。"]},
{ch:"第二章 教师心理",t:"“三头六臂”的新教师——角色冲突与调适",
bg:"吴老师入职某高校第一年：每周12节课，担任班主任，学院又要求青年教师申报课题“不报就影响考核”；学生期待他课后随时答疑，妻子抱怨他“回家心不在焉”，父母身体也不好。他白天上课、晚上写本子、周末处理班级事务，动辄得咎——学院嫌课题进度慢，学生说他答疑“敷衍”，家人说他“甩手掌柜”。近一个月他开始失眠、烦躁，自嘲“变成了三头六臂也顾不过来”。",
q:"问题：运用教师角色心理的相关理论分析吴老师的处境，并提出调适建议。",
pts:["①理论指认：吴老师面临角色冲突——学院（科研）、学生（教学）、家庭（陪伴）等多方期望相互矛盾、难以兼顾；同时存在角色超载——角色期望总量远超个人时间精力（12节课+班主任+科研+家庭）；新教师处于关注生存阶段，本身适应压力大，更易被多重角色压垮；失眠烦躁是长期压力的身心信号；","②结合材料：学院“不报就影响考核”与班主任事务冲突；学生期待与科研任务冲突；家庭责任与工作总量冲突——三种冲突具体对应；","③调适建议：个人层面——角色排序（先保教学基本盘）、时间管理（固定答疑时段、化零为整做科研）、提高角色技能、主动沟通争取理解；组织层面——学院落实新教师支持政策（入职初期减免科研要求、配备导师、班主任工作量互抵），人事部门合理安排青年教师负担；必要时寻求心理咨询。"]},
{ch:"第五章 知识获得",t:"“方法比努力更重要”——学习迁移的教学策略",
bg:"赵老师讲授《传播学概论》时，先用两周精讲“5W模式”“议程设置”等核心概念及其相互关系，构建清晰的知识框架；随后引导学生用同一套“概念分析框架”去剖析广告案例、新闻案例和热点舆情案例；期末又布置任务，让学生把课堂上的分析方法用于学院公众号的改版方案。学生反馈：“这套方法到哪儿都能用。”",
q:"问题：(1) 运用学习迁移理论分析赵老师的做法。(2) 说明促进知识迁移的教学策略。",
pts:["①迁移：一种学习对另一种学习的影响；赵老师帮助学生把课堂习得的概念框架迁移到广告、新闻、舆情等新案例（近迁移），再到公众号改版的真实实践（远迁移），属正迁移；其原理符合概括化理论——掌握高度概括的基本概念和原理（“5W”“议程设置”）才能广泛迁移；","②促进迁移的教学策略与材料对应：精选教材内容——只精讲具有广泛迁移价值的核心概念；合理编排教学内容——先建框架再作案例，一体化、网络化；合理安排教学程序——由课内案例到课外真实项目，由近及远、由易到难；教授学习策略——显性教给学生“概念分析框架”这一可迁移的方法，使其学会学习；","③启示：“为迁移而教”，教学的最终目的不是记住结论而是获得可迁移的原理与方法（授人以渔）。"]},
{ch:"第四章 学习理论",t:"从“讲堂”到“学堂”——建构主义教学改革",
bg:"钱老师讲授《新媒体概论》多年，一直精心制作PPT满堂讲授，但学生听课倦怠、考试靠背诵。本学期他改为项目式教学：以“为家乡文旅做一次短视频传播”为真实任务；学生5人一组，自主调研、分工创作；每周课堂进行组间讨论与互评，教师巡回点拨；期末各组展示完整传播方案并接受“甲方”（地方文旅部门真实反馈）。学生出勤率、课堂参与度和作品质量显著提升。",
q:"问题：(1) 运用建构主义学习理论分析钱老师的教学改革。(2) 结合其他学习理论，谈谈这一改革对新教师的启示。",
pts:["①建构主义四要素逐一对应：情境——真实文旅传播任务（真实情境中学习）；协作——5人小组自主分工合作；会话——每周组间讨论互评（交流讨论推进理解）；意义建构——学生在做方案中主动建构传播学知识而非被动接受；","②与传统讲授对照：过去是“教师传递、学生接受”的灌输式教学，学生机械记忆；改革后学生基于原有经验主动建构、在应用中理解知识（知识观：知识非绝对确定，需主动建构），体现了以学生为中心；","③启示：讲授法本身并非无效（奥苏贝尔：理解性的接受学习可以是有意义的），但须与学生经验建立实质联系；高校教学应结合探究式、合作式、项目式教学，激发内部动机（人本主义：真诚、共情、无条件积极关注地对待学生作品），实现“为迁移而教”。"]},
{ch:"第八章 品德",t:"“班级群风波”——品德培养与德育原则",
bg:"大二学生小郑在班级群转发了一条丑化辅导员的不实段子，引来哄笑和跟帖。辅导员查实后并未当众羞辱他，而是单独约谈：先听小郑抱怨“管理太严”，肯定他敢提意见的出发点（想改进班级管理），同时摆事实讲清不实信息对他人名誉和班级信任的伤害；要求小郑在群里公开澄清并道歉；随后请小郑担任班级“信息核实员”参与班务。两周后小郑又转发了一条未核实的消息，辅导员再次耐心提醒，小郑主动撤回并道歉。",
q:"问题：(1) 结合品德心理结构（知、情、意、行）分析辅导员的教育过程。(2) 分析其中体现的德育原则。",
pts:["①知情意行分析：道德认知——约谈讲理，使小郑认识不实信息的伤害（知是基础）；道德情感——倾听抱怨、肯定出发点，保护其自尊与上进心，唤起对当事人的歉意（情是动力）；道德意志与行为——公开澄清道歉、担任信息核实员，在职责和诱惑（转发博眼球）中锻炼抵制能力（意），并形成核实后再转发的行为习惯（行是标志）；小郑的反复正体现品德发展的反复性，需坚持抓反复；","②德育原则：疏导原则——循循善诱、以理服人而非压服；尊重学生与严格要求相结合——尊重人格、肯定出发点（尊重），同时坚决要求澄清道歉、不姑息（严格）；知行统一——认识教育落实为道歉、任职等行为实践；因材施教——针对小郑“有意见、爱发声”的特点安排核实员岗位，化消极因素为积极因素。"]},
{ch:"第十一章 动机",t:"“我不行了”的保研生——归因与自我效能感",
bg:"大四学生小方成绩一直名列前茅，因科研竞赛一项加分落选保研，随后考研模拟连失两城，她开始说“我就是不行了”“再学也没用”，整日躺床上刷手机，拒绝报考研班，连最擅长的英语题也不做了。辅导员发现，小方中学时也曾在奥赛失利后一蹶不振，直到换了老师不断鼓励才走出来。",
q:"问题：(1) 用韦纳归因理论和自我效能感理论分析小方的心理状态。(2) 为她设计一份辅导方案。",
pts:["①归因分析：小方把保研落选和模拟失利归因于“我不行”——能力归因（内部、稳定、不可控）。稳定归因使其对未来的成功期望丧失，不可控归因使努力失去意义，从而放弃行动（拒绝报班、不做题），形成习得性无助；其中学奥赛失利后的类似反应说明这是其惯常的消极归因模式；","②自我效能感分析：反复的失败经验（最重要来源）严重削弱其“我能做到”的效能感，连带否定自己最擅长的英语（过度泛化），选择逃避（刷手机）以避免再次失败；","③辅导方案：a.接纳情绪，重建信任；b.引导积极归因——与她一起复盘：落选是规则与单项加分所致（外部），模拟失利对应的是复习策略与投入不足（可控因素）；c.小步子成功——从最擅长的英语真题做起，积累成败经验，恢复效能感；d.提供相似榜样（曾落选后考上的学长学姐的替代性经验）；e.具体化的鼓励（言语说服）与放松训练（调节生理情绪状态）；f.制定阶段目标并逐步加难，巩固“努力+方法”归因风格。"]}

/* ================= 状态 ================= */
var LS_KEY="gdpsylx-v1";
var TYPES={single:SINGLE.length,judge:JUDGE.length,essay:ESSAY.length,cases:CASES.length};
var TABS=[
  {k:"home",n:"考情速览"},
  {k:"single",n:"单选题"},{k:"judge",n:"判断题"},
  {k:"essay",n:"举例说明"},{k:"cases",n:"案例分析"},
  {k:"wrong",n:"错题重做"}
];
var curTab="home";
var store=loadStore();
var order={single:idxList(SINGLE),judge:idxList(JUDGE),essay:idxList(ESSAY),cases:idxList(CASES)};

function idxList(arr){var a=[];for(var i=0;i<arr.length;i++)a.push(i);return a}
function loadStore(){
  try{var s=JSON.parse(localStorage.getItem(LS_KEY)||"{}");
    return {single:s.single||{},judge:s.judge||{},essay:s.essay||{},cases:s.cases||{}};
  }catch(e){return {single:{},judge:{},essay:{},cases:{}}}
}
function saveStore(){try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function countStat(t){
  var d=store[t],data=DATA(t),done=0,ok=0;
  for(var k in d){var qi=+k;if(!d.hasOwnProperty(k)||!(qi in data))continue;
    if(t==="single"){done++;if(d[k]===data[qi].a)ok++}
    else if(t==="judge"){done++;if(d[k]===data[qi].a)ok++}
    else{done++;if(d[k]==="got")ok++}
  }
  return {done:done,ok:ok,total:data.length};
}
function DATA(t){return t==="single"?SINGLE:t==="judge"?JUDGE:t==="essay"?ESSAY:CASES}

function wrongList(t){
  var d=store[t],data=DATA(t),w=[];
  for(var k in d){if(!d.hasOwnProperty(k))continue;var qi=+k;
    if(t==="single"){if(d[k]!==data[qi].a)w.push(qi)}
    else if(t==="judge"){if(d[k]!==data[qi].a)w.push(qi)}
  }
  return w;
}

/* ================= 渲染 ================= */
function renderTabs(){
  var h="";
  TABS.forEach(function(tb){
    var badge="";
    if(tb.k==="single")badge='<span class="n">'+SINGLE.length+"</span>";
    if(tb.k==="judge")badge='<span class="n">'+JUDGE.length+"</span>";
    if(tb.k==="essay")badge='<span class="n">'+ESSAY.length+"</span>";
    if(tb.k==="cases")badge='<span class="n">'+CASES.length+"</span>";
    if(tb.k==="wrong"){
      var w=wrongList("single").length+wrongList("judge").length;
      if(w>0)badge='<span class="n">'+w+"</span>";
    }
    h+='<div class="tab'+(curTab===tb.k?" on":"")+'" onclick="goTab(\''+tb.k+'\')">'+tb.n+badge+"</div>";
  });
  document.getElementById("tabs").innerHTML=h;
}

function statChip(t,label){
  var s=countStat(t);
  var rate=s.done?Math.round(s.ok/s.done*100):0;
  return '<span class="chip">'+label+"　已做 <b>"+s.done+"</b>/"+s.total+"　正确 <b>"+s.ok+"</b>　正确率 <b>"+rate+"%</b></span>";
}

function renderStatbar(){
  var el=document.getElementById("statbar");
  if(curTab==="home"){
    el.innerHTML="";
    return;
  }
  if(curTab==="wrong"){
    var w=wrongList("single").length+wrongList("judge").length;
    el.innerHTML='<span class="chip">错题本　待消灭 <b style="color:var(--red)">'+w+'</b> 题</span><span class="sp"></span>'+
      '<span class="chip" style="font-family:var(--kai)">答对后自动移出错题本</span>';
    return;
  }
  var label={single:"单选题",judge:"判断题",essay:"举例说明",cases:"案例分析"}[curTab];
  var right='<span class="sp"></span>';
  if(curTab==="single"||curTab==="judge"){
    right+='<label class="toggle"><input type="checkbox" id="shuf" onchange="toggleShuffle()"'+(shuffled?" checked":"")+'>乱序刷题</label>';
  }
  right+='<button class="btn warn" onclick="resetType(\''+curTab+'\')">重置本部分</button>';
  el.innerHTML=statChip(curTab,label)+right;
}

function qheadHTML(no,ch){
  return '<div class="qhead"><span class="qno">'+no+"</span><span class=\"qch\">"+esc(ch)+"</span></div>";
}

function renderSingle(){
  var h="";
  order.single.forEach(function(qi,pos){
    var q=SINGLE[qi],pick=store.single[qi];
    var locked=(pick!==undefined);
    h+='<div class="qcard"><div class="opts-holder">'+qheadHTML(pos+1,q.ch);
    h+='<div class="qtext">'+esc(q.q)+"</div>";
    h+='<div class="opts'+(locked?" locked":"")+'">';
    q.o.forEach(function(o,oi){
      var cls="opt";
      if(locked){
        if(oi===q.a)cls+=" right";
        else if(oi===pick)cls+=" pick";
        else cls+=" dim";
      }
      h+='<div class="'+cls+'" onclick="ansSingle('+qi+","+oi+')"><span class="L">'+String.fromCharCode(65+oi)+'</span><span class="T">'+esc(o)+"</span></div>";
    });
    h+="</div>";
    if(locked){
      var ok=pick===q.a;
      h+='<div class="fb '+(ok?"ok":"no")+'"><span class="tag">'+(ok?"✓ 答对了":"✗ 答错了")+"</span><span>正确答案："+String.fromCharCode(65+q.a)+"</span></div>";
      h+='<div class="exp"><span class="lb">解析</span>'+esc(q.e)+"</div>";
    }
    h+="</div></div>";
  });
  document.getElementById("panel").innerHTML=h;
}

function renderJudge(){
  var h="";
  order.judge.forEach(function(qi,pos){
    var q=JUDGE[qi],pick=store.judge[qi];
    var locked=(pick!==undefined);
    h+='<div class="qcard">'+qheadHTML(pos+1,q.ch);
    h+='<div class="qtext">'+esc(q.q)+"</div>";
    h+='<div class="jbtns'+(locked?" locked":"")+'">';
    var rightVal=q.a?0:1;
    ["正确","错误"].forEach(function(txt,val){
      var cls="jbtn";
      if(locked){
        if(val===rightVal)cls+=" right";
        else if(val===(pick?0:1))cls+=" pick";
      }
      h+='<div class="'+cls+'" onclick="ansJudge('+qi+','+val+')">'+txt+"</div>";
    });
    h+="</div>";
    if(locked){
      var ok=pick===q.a;
      h+='<div class="fb '+(ok?"ok":"no")+'"><span class="tag">'+(ok?"✓ 答对了":"✗ 答错了")+"</span><span>正确答案："+(q.a?"正确":"错误")+"</span></div>";
      h+='<div class="exp"><span class="lb">解析</span>'+esc(q.e)+"</div>";
    }
    h+="</div>";
  });
  document.getElementById("panel").innerHTML=h;
}

function renderSubjective(type){
  var arr=DATA(type),st=store[type],h="";
  order[type].forEach(function(qi,pos){
    var q=arr[qi],rec=st[qi]||{};
    h+='<div class="qcard">'+qheadHTML(pos+1,q.ch);
    if(type==="cases"){
      h+='<div class="qtext" style="font-size:16.5px">【案例分析】'+esc(q.t)+"</div>";
      h+='<div class="mat"><span class="lb">材料：</span>'+esc(q.bg)+"</div>";
      h+='<div class="qs">'+esc(q.q)+"</div>";
    }else{
      h+='<div class="qtext">'+esc(q.q)+"</div>";
    }
    h+='<textarea class="sheet" rows="5" placeholder="（先在此写下你的答案要点，再对照参考答案）" oninput="saveText(\''+type+"',"+qi+',this.value)">'+esc(rec.text||"")+"</textarea>";
    h+='<div class="refbtns">';
    if(!rec.show)h+='<button class="btn" onclick="showRef(\''+type+"',"+qi+')">对照参考答案</button>';
    else{
      h+='<button class="btn mini" onclick="hideRef(\''+type+"',"+qi+')">收起参考答案</button>';
    }
    h+="</div>";
    if(rec.show){
      h+='<div class="ref"><span class="lb">【参考答案要点】</span><ul>';
      q.pts.forEach(function(p){h+="<li>"+esc(p)+"</li>"});
      h+="</ul>";
      if(q.demo)h+='<div class="demo">'+esc(q.demo)+"</div>";
      h+="</div>";
      h+='<div class="selfmark">自评掌握情况：';
      h+='<button class="btn'+(rec.mark==="got"?" did":"")+'" onclick="markSub(\''+type+"',"+qi+',\'got\')">✓ 已掌握</button>';
      h+='<button class="btn'+(rec.mark==="again"?" again":"")+'" onclick="markSub(\''+type+"',"+qi+',\'again\')">✗ 需巩固</button>';
      h+="</div>";
    }
    h+="</div>";
  });
  document.getElementById("panel").innerHTML=h;
}

function renderWrong(){
  var ws=wrongList("single"),wj=wrongList("judge"),h="";
  if(!ws.length&&!wj.length){
    h='<div class="note" style="text-align:center;padding:50px 20px"><h3 style="text-align:center">🎉 错题本是空的</h3><p style="text-align:center">做完单选题、判断题后，答错的题目会自动收进来。<br>在下方重做，答对即可移出错题本。</p></div>';
  }
  ws.forEach(function(qi,i){
    var q=SINGLE[qi],pick=store.single[qi];
    h+='<div class="qcard">'+qheadHTML("错"+(i+1),q.ch)+"<div class=\"qtext\">"+esc(q.q)+"</div>";
    h+='<div class="opts locked">';
    q.o.forEach(function(o,oi){
      var cls="opt";
      if(oi===q.a)cls+=" right";else if(oi===pick)cls+=" pick";else cls+=" dim";
      h+='<div class="'+cls+'"><span class="L">'+String.fromCharCode(65+oi)+'</span><span class="T">'+esc(o)+"</span></div>";
    });
    h+="</div>";
    h+='<div class="fb no"><span class="tag">✗ 曾答错</span><span>正确答案：'+String.fromCharCode(65+q.a)+"</span></div>";
    h+='<div class="exp"><span class="lb">解析</span>'+esc(q.e)+"</div>";
    h+='<div class="redo"><button class="btn mini warn" onclick="redoOne(\'single\','+qi+')">重做此题</button></div></div>';
  });
  wj.forEach(function(qi,i){
    var q=JUDGE[qi],pick=store.judge[qi];
    h+='<div class="qcard">'+qheadHTML("错"+(ws.length+i+1),q.ch)+"<div class=\"qtext\">"+esc(q.q)+"</div>";
    h+='<div class="fb no"><span class="tag">✗ 曾答错</span><span>你选了「'+(pick?"正确":"错误")+"」，正确答案："+(q.a?"正确":"错误")+"</span></div>";
    h+='<div class="exp"><span class="lb">解析</span>'+esc(q.e)+"</div>";
    h+='<div class="redo"><button class="btn mini warn" onclick="redoOne(\'judge\','+qi+')">重做此题</button></div></div>';
  });
  document.getElementById("panel").innerHTML=h;
}

     "<li><b>命题来源：</b>广东省高校师资培训中心统一组建题库、集中阅卷，试题覆盖面广、重基础。</li>"+
     "<li><b>成绩用途：</b>“两学”成绩是申请高校教师资格认定的必要条件，有效期五年。</li>"+
     "</ul></div>";

     "<li><span class='k'>⭐ 高频：</span>第四章学习理论——斯金纳强化四种类型辨析、奥苏贝尔有意义学习、布鲁纳发现学习、班杜拉观察学习、建构主义与人本主义。</li>"+
     "<li><span class='k'>⭐ 高频：</span>教师心理——成长三阶段、新手到专家、职业倦怠三维度。</li>"+
     "<li><span class='k'>常考：</span>皮亚杰/埃里克森/维果茨基、问题解决四阶段与影响因素、创造性三特征、品德知情意行、科尔伯格三水平六阶段。</li>"+
     "</ul></div>";
  h+='<div class="note"><h3><span class="no">3</span>答题要领</h3>'+
     "<ul>"+

     "<li><b>案例分析：</b>三步走——①指认理论（是什么）；②结合材料逐句对应分析（怎么体现）；③提出对策建议（怎么办）。切忌只抄理论不结合材料。</li>"+
     "</ul>"+

function render(){
  renderTabs();renderStatbar();
  if(curTab==="home")renderHome();
  else if(curTab==="single")renderSingle();
  else if(curTab==="judge")renderJudge();
  else if(curTab==="essay")renderSubjective("essay");
  else if(curTab==="cases")renderSubjective("cases");
  else renderWrong();
}

/* ================= 交互 ================= */
function goTab(k){curTab=k;render();window.scrollTo({top:0})}
function ansSingle(qi,oi){
  if(store.single[qi]!==undefined)return;
  store.single[qi]=oi;saveStore();render();
}
function ansJudge(qi,val){
  if(store.judge[qi]!==undefined)return;
  store.judge[qi]=(val===0);saveStore();render();
}
var shuffled=false;
function toggleShuffle(){
  var cb=document.getElementById("shuf");
  shuffled=!!cb.checked;
  ["single","judge"].forEach(function(t){
    order[t]=idxList(DATA(t));
    if(shuffled){/* Fisher-Yates */
      var a=order[t];
      for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp}
    }
  });
  render();window.scrollTo({top:0});
}
function saveText(type,qi,val){
  var rec=store[type][qi]||{};rec.text=val;store[type][qi]=rec;
  clearTimeout(saveText._t);
  saveText._t=setTimeout(saveStore,400);
}
function showRef(type,qi){var rec=store[type][qi]||{};rec.show=true;store[type][qi]=rec;saveStore();render()}
function hideRef(type,qi){var rec=store[type][qi]||{};rec.show=false;store[type][qi]=rec;saveStore();render()}
function markSub(type,qi,m){var rec=store[type][qi]||{};rec.mark=m;store[type][qi]=rec;saveStore();render()}
function redoOne(type,qi){delete store[type][qi];saveStore();render()}
function resetType(t){
  if(!confirm("确定重置本部分的所有作答记录吗？"))return;
  store[t]={};saveStore();render();window.scrollTo({top:0});
}
function resetAll(){store={single:{},judge:{},essay:{},cases:{}};saveStore();render();window.scrollTo({top:0})}

document.getElementById("totalN").textContent=SINGLE.length+JUDGE.length+ESSAY.length+CASES.length;
render();
</script>
